name: rollout

# Installs the application versions from applications.yml, in the order a person
# would: the rc machines first, then one production machine, then the rest.
# Every step is separate and manual on purpose -- nothing here decides that a
# release is healthy.

on:
  workflow_dispatch:
    inputs:
      stage:
        description: Which step to run
        required: true
        type: choice
        options: [rc, canary, prod]
      apps:
        description: 'Limit to some apps, e.g. ["pixapi"]. Empty means all.'
        default: ""

env:
  OCI_COMPARTMENT_OCID: ${{ vars.OCI_COMPARTMENT_OCID }}
  OCI_VAULT_OCID: ${{ vars.OCI_VAULT_OCID }}
  OCI_VAULT_KEY_OCID: ${{ vars.OCI_VAULT_KEY_OCID }}
  PSCLOUD_DB_HOST: ${{ vars.PSCLOUD_DB_HOST }}

jobs:
  deploy:
    runs-on: [self-hosted, pscloud-monitoring]
    environment: ${{ inputs.stage == 'rc' && 'rc' || 'prod' }}
    steps:
      - uses: actions/checkout@v4

      - name: Collections
        working-directory: ansible
        run: ansible-galaxy install -r requirements.yml

      - name: Versions being installed
        working-directory: ansible
        run: |
          yq '.applications | to_entries | map(.key + " " + .value.version) | .[]' \
            group_vars/role_app/applications.yml >> "$GITHUB_STEP_SUMMARY"

      - name: Deploy
        working-directory: ansible
        run: |
          case "${{ inputs.stage }}" in
            rc)     limit="env_rc";   serial=1   ;;
            canary) limit="env_prod"; serial=1   ;;
            prod)   limit="env_prod"; serial=25% ;;
          esac
          extra=""
          [ -n "${{ inputs.apps }}" ] && extra="-e deploy_apps=${{ inputs.apps }}"
          ansible-playbook deploy.yml -l "$limit" -e "deploy_serial=$serial" $extra
