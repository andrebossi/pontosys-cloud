name: rc

# The only way a version enters versions_rc.yml, and the only thing that can
# ever run unattended -- canary and stable only ever move through
# promote.yml, a manual action every time. Called directly (workflow_call)
# by an app repo's own pipeline right after publish.yml uploads that
# version's artifact, in the same run -- no repository_dispatch, no PAT,
# no async wait for a separate workflow to pick it up.
#
# Commits that one release_groups_rc[group][app] line straight to main (same
# pattern promote.yml already uses for versions_canary.yml/versions_stable.yml
# -- no PR, no auto-merge) and deploys it to rc in the same run.
#
#   deploy:
#     needs: publish
#     uses: andrebossi/pontosys-cloud/.github/workflows/rc.yml@main
#     with: { group: pixapi, app: pixapi, version: 2026.09.12 }
#     secrets: inherit
#
# workflow_dispatch re-runs rc without moving any version -- e.g. after an
# infra-only change, with no version movement involved.

on:
  workflow_call:
    inputs:
      group:
        required: true
        type: string
        description: which release_groups_rc group this app belongs to
      app:
        required: true
        type: string
      version:
        required: true
        type: string
  workflow_dispatch:
    inputs:
      apps:
        description: 'Limit to some apps, e.g. ["pixapi"]. Empty means all.'
        default: ""

env:
  OCI_CI_TENANCY_OCID: ${{ secrets.OCI_CI_TENANCY_OCID }}
  OCI_CI_USER_OCID: ${{ secrets.OCI_CI_USER_OCID }}
  OCI_CI_FINGERPRINT: ${{ secrets.OCI_CI_FINGERPRINT }}
  OCI_CI_PRIVATE_KEY: ${{ secrets.OCI_CI_PRIVATE_KEY }}
  OCI_CI_REGION: ${{ vars.OCI_CI_REGION }}
  OCI_VAULT_OCID: ${{ vars.OCI_VAULT_OCID }}
  OCI_MONITORING_IP: ${{ vars.OCI_MONITORING_IP }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: rc
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Bump one app's rc version
        if: github.event_name == 'workflow_call'
        working-directory: ansible
        run: |
          set -euo pipefail
          group='${{ inputs.group }}'
          app='${{ inputs.app }}'
          version='${{ inputs.version }}'
          if [ "$(yq ".release_groups_rc.\"$group\" // \"\"" group_vars/role_app/versions_rc.yml)" = "" ]; then
            echo "No such group '$group' in release_groups_rc." >&2
            exit 1
          fi
          yq -i ".release_groups_rc.\"$group\".\"$app\" = \"$version\"" group_vars/role_app/versions_rc.yml

      - name: Commit
        if: github.event_name == 'workflow_call'
        id: commit
        run: |
          set -euo pipefail
          git config user.name "pscloud-bot"
          git config user.email "bot@pontosys.com"
          git add ansible/group_vars/role_app/versions_rc.yml
          git commit -m "rc: ${{ inputs.app }} -> ${{ inputs.version }}"
          git push origin HEAD:main
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Determine deploy filter
        id: filter
        run: |
          if [ "${{ github.event_name }}" = "workflow_call" ]; then
            echo 'arg=-e deploy_apps=["${{ inputs.app }}"]' >> "$GITHUB_OUTPUT"
          elif [ -n "${{ inputs.apps }}" ]; then
            echo 'arg=-e deploy_apps=${{ inputs.apps }}' >> "$GITHUB_OUTPUT"
          else
            echo "arg=" >> "$GITHUB_OUTPUT"
          fi

      - name: Versions being installed
        working-directory: ansible
        run: |
          yq '.release_groups_rc | to_entries | map(.value | to_entries | map(.key + " " + .value)) | flatten | .[]' \
            group_vars/role_app/versions_rc.yml >> "$GITHUB_STEP_SUMMARY"

      - name: Deploy to rc
        uses: ./.github/actions/run-on-monitoring
        with:
          command: |
            set -euo pipefail
            cd ~/pscloud && git fetch --quiet && git checkout --quiet '${{ steps.commit.outputs.sha || github.sha }}'
            cd ansible
            ansible-galaxy install -r requirements.yml
            ansible-playbook -i inventories/rc deploy.yml -l role_app -e deploy_serial=1 ${{ steps.filter.outputs.arg }}
