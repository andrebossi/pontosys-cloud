name: publish artifact

# What an application repository calls after `dotnet publish` (or an
# Ionic/Flutter build -- this just tars a directory and uploads it, so a
# frontend repo calls it exactly like a .NET repo does).
#
# Uploads one tarball to the bucket. Doesn't touch versions_rc.yml or deploy
# anything -- chain a call to rc.yml right after this one (needs:) in the
# caller's own workflow to actually land the version in rc.
#
# Called from another repository, after a job in that same workflow has
# uploaded the build output as a run artifact (actions/upload-artifact):
#   publish:
#     needs: build
#     uses: andrebossi/pontosys-cloud/.github/workflows/publish.yml@main
#     with: { name: pixapi, version: 2026.09.12, artifact: pixapi-build }
#     secrets: inherit
#
# The caller needs these org-level secrets/vars available to it (secrets:
# inherit, or org-level vars): OCI_CI_TENANCY_OCID, OCI_CI_USER_OCID,
# OCI_CI_FINGERPRINT, OCI_CI_PRIVATE_KEY, OCI_CI_REGION (the existing CI OCI
# API key) and OCI_ARTIFACT_BUCKET.

on:
  workflow_call:
    inputs:
      name:
        required: true
        type: string
        description: artifact key, e.g. pixapi -- also the release_groups_rc[group] key
      version:
        required: true
        type: string
      artifact:
        required: true
        type: string
        description: >-
          name of a build-output artifact already uploaded earlier in this
          same workflow run (actions/upload-artifact) -- a reusable-workflow
          job has no steps of its own before this one runs, so it can't see
          a caller's checkout directly; it has to be handed over as a run
          artifact instead

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      OCI_CLI_TENANCY: ${{ secrets.OCI_CI_TENANCY_OCID }}
      OCI_CLI_USER: ${{ secrets.OCI_CI_USER_OCID }}
      OCI_CLI_FINGERPRINT: ${{ secrets.OCI_CI_FINGERPRINT }}
      OCI_CLI_KEY_CONTENT: ${{ secrets.OCI_CI_PRIVATE_KEY }}
      OCI_CLI_REGION: ${{ vars.OCI_CI_REGION }}
      OCI_ARTIFACT_BUCKET: ${{ vars.OCI_ARTIFACT_BUCKET }}
    steps:
      - name: Download the build output
        uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.artifact }}
          path: /tmp/publish-input

      - name: Pack
        run: tar -C /tmp/publish-input -czf /tmp/artifact.tar.gz .

      - name: Object storage namespace
        id: ns
        uses: oracle-actions/run-oci-cli-command@v1.3.2
        with:
          command: os ns get
          query: data

      - name: Upload
        uses: oracle-actions/run-oci-cli-command@v1.3.2
        with:
          command: >-
            os object put --namespace ${{ steps.ns.outputs.raw_output }}
            --bucket-name ${{ env.OCI_ARTIFACT_BUCKET }}
            --name artifacts/${{ inputs.name }}/${{ inputs.name }}-${{ inputs.version }}.tar.gz
            --file /tmp/artifact.tar.gz --force

      - name: Summary
        run: echo "Uploaded \`${{ inputs.name }} ${{ inputs.version }}\`." >> "$GITHUB_STEP_SUMMARY"
