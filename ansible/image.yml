---
# The golden image, built by Packer against a throwaway instance.
#
# It comes out complete -- runtime, fonts, nginx, the frontends, the units, the
# agent and the applications at the versions in applications.yml -- and carries
# no credential: the env files are @@secret@@ templates that pscloud-env.service
# resolves on first boot with the instance's own principal.
- name: Golden image
  hosts: default
  become: true
  vars:
    app_bake: true
  roles:
    - base
    - pscloud
    - dotnet_runtime
    - nginx_app
    - dotnet_app
    - app_deploy
    - observability_agent

  post_tasks:
    - name: Strip machine state before capture
      ansible.builtin.shell:
        cmd: |
          rm -rf /var/lib/fluent-bit/*.db /var/lib/fluent-bit/storage/*
          truncate -s 0 /etc/machine-id
          cloud-init clean --logs || true
          rm -f /run/instance.env /etc/dotnet-apps/*.env
      changed_when: true
