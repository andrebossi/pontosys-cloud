---
# Version manifests: what an environment runs, and how a version crosses from
# one environment to the next.
#
#   ansible-playbook release.yml                                  # rc, as it stands
#   ansible-playbook release.yml -e release_action=show   -e release_from_env=prod
#   ansible-playbook release.yml -e release_action=list   -e release_from_env=rc
#
#   # rc validated -> prod's target. Copies the app versions VERBATIM: the
#   # point is that prod runs what rc tested, not a fresh "latest".
#   ansible-playbook release.yml -e release_action=promote \
#                                -e release_from_env=rc -e release_to_env=prod
#
#   # undo a promotion
#   ansible-playbook release.yml -e release_action=rollback \
#                                -e release_to_env=prod -e release_tag=2026.09.10-2-prod
#
# Then bake and roll out:
#   cd packer && packer build ... app.pkr.hcl        # image from prod's manifest
#   ansible-playbook deploy.yml -e image_action=release
#   ansible-playbook deploy.yml -e canary_action=up
#   ansible-playbook deploy.yml -e canary_action=shift -e canary_percent=25
#   ansible-playbook deploy.yml -e canary_action=gate
#   ansible-playbook deploy.yml -e canary_action=promote
#   ansible-playbook deploy.yml -e image_action=prune
- name: Manifests
  hosts: role_monitoring
  become: true
  roles:
    - role: app_release
      vars:
        release_action: "{{ release_action | default('show') }}"
