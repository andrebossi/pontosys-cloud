---
# Version manifests. Runs on whichever host holds the OCI credentials -- the
# monitoring VM in the cloud, the control node locally.
#
#   ansible-playbook release.yml                                   # rc, as it stands
#   ansible-playbook release.yml -e release_action=show  -e release_from_env=prod
#   ansible-playbook release.yml -e release_action=list  -e release_from_env=rc
#
#   # what rc validated becomes prod's target -- versions copied verbatim
#   ansible-playbook release.yml -e release_action=promote \
#                                -e release_from_env=rc -e release_to_env=prod
#
#   # undo a promotion
#   ansible-playbook release.yml -e release_action=rollback \
#                                -e release_to_env=prod -e release_tag=2026.09.10-2-prod
#
# Golden images are not managed here. Packer builds one, and pointing the
# instance pool at it is `app_image_id` in infra/live/<env>/app-tier -- a
# reviewed Terraform change rather than an API call from a playbook.
- name: Manifests
  hosts: role_monitoring
  become: true
  roles:
    - role: release
      vars:
        release_action: "{{ release_action | default('show') }}"
