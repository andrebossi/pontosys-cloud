[defaults]
# No default inventory on purpose: prod and rc share a compartment, so a run
# with no -i would be a run against whichever one the default happened to name.
#   ansible-playbook -i inventories/production site.yml
roles_path           = roles
collections_path     = collections
host_key_checking    = False
interpreter_python   = /usr/bin/python3
stdout_callback      = default
result_format        = yaml
callbacks_enabled    = profile_tasks
forks                = 10
retry_files_enabled  = False

[inventory]
cache          = True
cache_plugin   = jsonfile
cache_timeout  = 300
cache_connection = /tmp/ansible-oci-inventory

[ssh_connection]
pipelining = True
ssh_args = -o ControlMaster=auto -o ControlPersist=120s -o ServerAliveInterval=30
