[defaults]
inventory            = inventory/oci.yml
roles_path           = roles
host_key_checking    = False
interpreter_python   = /usr/bin/python3
stdout_callback      = yaml
forks                = 10
retry_files_enabled  = False

[ssh_connection]
pipelining = True
# A VM de monitoracao e o unico host com IP publico -- ela e o salto para as
# subnets privadas de app e de banco.
ssh_args = -o ControlMaster=auto -o ControlPersist=120s -o ServerAliveInterval=30
