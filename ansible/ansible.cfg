[defaults]
inventory            = inventory/oci.yml
roles_path           = roles
collections_path     = collections
host_key_checking    = False
interpreter_python   = /usr/bin/python3
stdout_callback      = default
# The standalone `yaml` callback was removed in community.general 12; this is
# the supported way to get the same readable output.
result_format        = yaml
callbacks_enabled    = profile_tasks
forks                = 10
retry_files_enabled  = False

[inventory]
# The OCI plugin makes one API call per compartment on every play. The cache
# turns a `site.yml` run plus three ad-hoc checks into a single call.
cache          = True
cache_plugin   = jsonfile
cache_timeout  = 300
cache_connection = /tmp/ansible-oci-inventory

[ssh_connection]
pipelining = True
# The monitoring VM is the only host with a public IP -- it is the jump host
# into the private app and database subnets.
ssh_args = -o ControlMaster=auto -o ControlPersist=120s -o ServerAliveInterval=30
