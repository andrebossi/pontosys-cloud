# Dynamic inventory. Instance pool VMs have no stable name or IP -- a static
# file would be wrong on the first scale-out. Grouping comes from the defined
# tags Terraform applies (pscloud.role, pscloud.environment), the SAME tags
# that drive the IAM dynamic groups. One source of truth for network, identity
# and Ansible.
#
#   ansible-inventory --graph        # role_app, role_monitoring, env_prod, ...
#   ansible-inventory --host 10.20.16.5
plugin: oracle.oci.oci

regions:
  - sa-saopaulo-1

compartments:
  - compartment_ocid: "{{ lookup('env', 'OCI_COMPARTMENT_OCID') }}"
    fetch_hosts_from_subcompartments: false

# Only running instances: a TERMINATED one still answers the API for a while
# and would make every play wait on an SSH timeout.
instance_states:
  - RUNNING

hostname_format: private_ip

keyed_groups:
  # pscloud.role = app | monitoring | db  ->  role_app, role_monitoring, role_db
  - key: defined_tags['pscloud']['role']
    prefix: role
    separator: "_"

  # pscloud.environment = prod | rc  ->  env_prod, env_rc
  - key: defined_tags['pscloud']['environment']
    prefix: env
    separator: "_"

  # Instance pool membership: the canary and the stable pool are the same role
  # but must be addressable separately during a release.
  - key: freeform_tags['pscloud_pool'] | default('none')
    prefix: pool
    separator: "_"

compose:
  ansible_host: private_ip
  oci_display_name: display_name
  oci_fault_domain: fault_domain
  oci_shape: shape
