---
# ===========================================================================
# APPLICATION VMs — instance pool members, behind the load balancer.
# Every machine runs ALL apps; the local nginx routes by server_name.
# ===========================================================================
app_backend_port: 8080

# ---------------------------------------------------------------------------
# APPLICATION CATALOG
#
# tier decides the systemd limits (see roles/dotnet_app/defaults/main.yml).
# listen_port is the local Kestrel, always on 127.0.0.1.
# server_names is what nginx matches on: routing by host, not by path — the
# .NET apps generate absolute URLs and a path prefix would break redirects
# and cookies.
# ---------------------------------------------------------------------------
applications:
  site-virtualstore:
    listen_port: 5001
    tier: site
    server_names: [loja.exemplo.com.br, www.loja.exemplo.com.br]

  site-monitorclientes:
    listen_port: 5002
    tier: site
    server_names: [monitor.exemplo.com.br]

  api-vendas:
    listen_port: 5011
    tier: api
    server_names: [api-vendas.exemplo.com.br]

  api-cadastros:
    listen_port: 5012
    tier: api
    server_names: [api-cadastros.exemplo.com.br]

  api-entradas:
    listen_port: 5013
    tier: api
    server_names: [api-entradas.exemplo.com.br]

  api-relatorios:
    listen_port: 5014
    # Reports are heavy and tolerate slowness: more memory, lower CPU
    # priority, longer timeout.
    tier: batch
    server_names: [api-relatorios.exemplo.com.br]

  api-dashboards:
    listen_port: 5015
    tier: api
    server_names: [api-dashboards.exemplo.com.br]

  api-pix:
    listen_port: 5016
    # Payments: the most critical app. High CPU priority and no failover to
    # the peer (see app_peer_failover_exclude).
    tier: critical
    server_names: [api-pix.exemplo.com.br]

  api-monitorclientes:
    listen_port: 5017
    tier: api
    server_names: [api-monitorclientes.exemplo.com.br]

# App queried by /readyz. This is the canary's gate: /healthz is a static 200
# from nginx and only proves the VM is alive.
readyz_app: api-vendas

# ---------------------------------------------------------------------------
# FAILOVER BETWEEN VMs
#
# If an app dies only on this machine, the local nginx sends traffic to the
# other VM's Kestrel instead of returning 502. This gives per-app HA without
# needing a per-app backend set on the load balancer (which would break the
# canary ramp, since weight only exists WITHIN a backend set).
#
# Cost: an extra hop on the internal network during the failure.
# ---------------------------------------------------------------------------
app_peer_failover: true

# Apps that must NOT fail over to the peer. Payments with in-memory session
# state is the classic case: better to fail visibly than process in the
# wrong place.
app_peer_failover_exclude:
  - api-pix

# Passive nginx health check: after max_fails errors within fail_timeout, the
# upstream leaves rotation for fail_timeout. Open-source nginx has no active
# health check -- this is what's available, and it's enough.
app_upstream_max_fails: 3
app_upstream_fail_timeout: 10s

app_db_pool_max: 12

fluentbit_extra_inputs:
  # .NET apps log. The slice filter is what gives the collection its
  # identity -- without Slice=apps.slice on the unit, the app runs but stays
  # invisible here.
  - name: systemd
    tag: app.log
    systemd_filter:
      - _SYSTEMD_SLICE=apps.slice
    strip_underscores: true
    read_from_tail: true
    max_entries: 1000
    db: /var/lib/fluent-bit/systemd-apps.db
    storage.type: filesystem
    threaded: "on"

  - name: tail
    tag: nginx.access
    path: /var/log/nginx/access.json.log
    parser: nginx_json
    refresh_interval: 5
    mem_buf_limit: 8MB
    skip_long_lines: "on"
    db: /var/lib/fluent-bit/nginx_access.db
    storage.type: filesystem
    threaded: "on"

  # stub_status: active/accepted connections. Built-in collector, no nginx-exporter.
  - name: nginx_metrics
    tag: nginx_metrics
    host: 127.0.0.1
    port: 8081
    status_url: /nginx_status
    nginx_plus: "off"
    scrape_interval: 30

fluentbit_extra_filters:
  - name: lua
    match: app.log
    script: systemd_classify.lua
    call: classify

  # Request counter by status and method, in the spirit of
  # istio_requests_total. stub_status does NOT have a status code -- without
  # this filter there's no 5xx metric, and the app-down alert has no basis.
  - name: log_to_metrics
    match: nginx.access
    tag: nginx_req_metrics
    metric_mode: counter
    metric_name: nginx_requests
    metric_description: Total requests by app, status and method
    label_field:
      - app
      - status
      - method

  # request_time is emitted without quotes in log_format (numeric). upstream_time
  # comes in quotes and can be empty or a comma-separated list when there's more
  # than one upstream -- unusable as a value_field.
  - name: log_to_metrics
    match: nginx.access
    tag: nginx_req_metrics
    metric_mode: histogram
    metric_name: nginx_request_duration_seconds
    metric_description: Total request latency
    value_field: request_time
    label_field:
      - app
      - status

fluentbit_extra_outputs:
  - name: loki
    match: app.log
    host: "{{ monitoring_private_ip }}"
    port: 9428
    uri: /insert/loki/api/v1/push
    labels: job=app,instance=${INSTANCE_NAME},fd=${FD},pool=${POOL}
    label_keys: $unit,$kind
    line_format: json
    remove_keys: BOOT_ID,MACHINE_ID,CAP_EFFECTIVE,SYSTEMD_CGROUP,SYSTEMD_INVOCATION_ID,SYSTEMD_SLICE,SOURCE_REALTIME_TIMESTAMP,SELINUX_CONTEXT,AUDIT_SESSION,AUDIT_LOGINUID,STREAM_ID,SYSLOG_FACILITY
    retry_limit: 5
    storage.total_limit_size: 512M

  - name: loki
    match: nginx.access
    host: "{{ monitoring_private_ip }}"
    port: 9428
    uri: /insert/loki/api/v1/push
    labels: job=nginx,instance=${INSTANCE_NAME},fd=${FD},pool=${POOL}
    label_keys: $app,$status
    line_format: json
    retry_limit: 5
    storage.total_limit_size: 512M

fluentbit_extra_files:
  - systemd_classify.lua

# The node_exporter_metrics `processes` collector only counts processes by
# state: it gives neither individual CPU nor memory. Since each app runs with
# its own MemoryMax and CPUQuota, without this exporter per-app throttling and
# OOM events stay invisible -- which is exactly the gap being closed.
textfile_exporters:
  - name: cgroup
    src: cgroup-textfile-exporter.sh
    interval: 30
