---
# RC — the mutable environment. Fixed instances with stable addresses, so
# nothing is replaced underneath a deploy and in-place delivery is the right
# fit: RC exists to shorten the loop, and minting an image per candidate would
# defeat that.
#
# The bargain is that RC leaves a RECORD. Every deploy publishes a manifest,
# and that manifest -- not a fresh resolution of "latest" -- is what gets
# promoted and baked.
app_env: rc
app_version_source: latest
app_manifest_write: true
