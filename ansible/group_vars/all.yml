---
# Only what is true for the whole fleet. Anything belonging to one role goes in
# group_vars/role_<role>/, anything true for one machine in host_vars/.
label_prefix: pscloud
oci_region: sa-saopaulo-1
compartment_ocid: "{{ lookup('env', 'OCI_COMPARTMENT_OCID') }}"

timezone: America/Sao_Paulo

# Every credential lives in OCI Vault, under this prefix. Secret names allow
# [A-Za-z0-9_-] only -- no slashes.
secret_prefix: "{{ label_prefix }}-{{ app_env | default('prod') }}"

# VM.Standard.E4.Flex, 1 OCPU (2 vCPU), 6 GB. Every ceiling downstream is
# derived from these two numbers, so re-shaping the VM is a two-line change
# and the slice ceilings, the GC limits and the nginx worker count follow.
host_vcpus: 2
host_memory_mb: 6144

# OCI Object Storage holds the application tarballs and the version manifests.
# A machine reads it through a pre-authenticated URL minted by the orchestrator,
# so an autoscaled VM needs no credential of its own and the bytes go over the
# service gateway instead of the NAT gateway.
artifact_bucket: pscloud-artifacts

# bucket | local, and oci | local. group_vars/env_local.yml flips both.
#
# bucket   the object store, reached through a short-lived pre-authenticated
#          URL minted by app_release_host. The target needs no credential.
# local    a directory on the control node, laid out the same way, so the same
#          tarballs work in both.
artifact_store: bucket
local_artifact_dir: "{{ lookup('env', 'HOME') }}/pscloud-artifacts"
# Long enough for a slow unpack on a small box, short enough that a leaked log
# line is worthless by the time anyone reads it.
artifact_par_ttl: 900

secrets_backend: oci

# Where the `pscloud` CLI runs: it needs OCI credentials, which the monitoring
# VM has through its instance principal. Falls back to the control node -- the
# case during a Packer build, and the case for every local run.
app_release_host: "{{ groups['role_monitoring'] | first | default('localhost') }}"

# Where telemetry goes. One dictionary, consumed by observability_agent:
# moving the backend is one edit, with no template or task changes.
monitoring_host: "{{ groups['role_monitoring'] | first | default('127.0.0.1') }}"

monitoring_endpoints:
  metrics:
    host: "{{ monitoring_host }}"
    port: 8428
    uri: /api/v1/write
  logs:
    host: "{{ monitoring_host }}"
    port: 9428
    # VictoriaLogs' native JSON-lines endpoint. The Loki-compatible one it also
    # exposes costs a translation on both sides and drops every field that is
    # not a stream label; this one stores the whole record and makes each field
    # queryable. Each output appends its own _stream_fields.
    uri: /insert/jsonline

# Shared by every log output. _msg_field takes a comma-separated list and uses
# the first field present on the record: MESSAGE for journald, uri for the
# nginx access log. _time_field is `date` because Fluent Bit's http output
# writes its timestamp under that key when json_date_format is iso8601.
vl_query: "_msg_field=MESSAGE,uri,log,msg&_time_field=date"
