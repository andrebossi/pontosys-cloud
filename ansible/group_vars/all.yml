---
label_prefix: pscloud
compartment_ocid: "{{ lookup('env', 'OCI_COMPARTMENT_OCID') }}"
oci_vault_id: "{{ lookup('env', 'OCI_VAULT_OCID') }}"
oci_vault_key_id: "{{ lookup('env', 'OCI_VAULT_KEY_OCID') }}"
artifact_bucket: pscloud-artifacts

timezone: America/Sao_Paulo

# Names in the vault. Database passwords are generated on first use; the rest
# are created once by hand.
secret_prefix: "{{ label_prefix }}-{{ app_env }}"
app_env: prod

# VM.Standard.E4.Flex, 1 OCPU (2 vCPU), 6 GB. The slice ceilings, the GC limits
# and the nginx worker count all follow from these two numbers.
host_vcpus: 2
host_memory_mb: 6144

monitoring_host: "{{ groups['role_monitoring'] | first | default('127.0.0.1') }}"

monitoring_endpoints:
  metrics: { host: "{{ monitoring_host }}", port: 8428, uri: /api/v1/write }
  logs:    { host: "{{ monitoring_host }}", port: 9428, uri: /insert/jsonline }

# _msg_field takes a list and uses the first field present: MESSAGE for
# journald, uri for the nginx access log. _time_field is `date` because that is
# the key Fluent Bit writes with json_date_format: iso8601.
vl_query: "_msg_field=MESSAGE,uri,log,msg&_time_field=date"
