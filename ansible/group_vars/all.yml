---
# SHARED — identical in every environment.

label_prefix: pscloud

compartment_ocid: "{{ lookup('env', 'OCI_COMPARTMENT_OCID') }}"
oci_vault_id: "{{ lookup('env', 'OCI_VAULT_OCID') }}"
oci_vault_key_id: "{{ lookup('env', 'OCI_VAULT_KEY_OCID') }}"

secret_prefix: "{{ label_prefix }}"

artifact_bucket: "{{ label_prefix }}-releases"
artifact_cache: /tmp/pscloud-artifacts

timezone: America/Sao_Paulo
ansible_managed: "Ansible managed -- edits are overwritten on the next run"

monitoring_host: "{{ groups['role_monitoring'] | first | default('127.0.0.1') }}"
monitoring_endpoints:
  metrics: { host: "{{ monitoring_host }}", port: 8428, uri: /api/v1/write }
  logs:    { host: "{{ monitoring_host }}", port: 9428, uri: /insert/jsonline }

vl_query: "_msg_field=MESSAGE,uri,log,msg&_time_field=date"
