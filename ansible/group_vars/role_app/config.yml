---
app_public_url: "https://virtualstore.pontosys.com"

url_monitorclientesapi: "http://127.0.0.1:{{ applications.monitorclientesapi.port }}{{ applications.monitorclientesapi.path }}"
url_geradorrelatoriosapi: "http://127.0.0.1:{{ applications.geradorrelatoriosapi.port }}{{ applications.geradorrelatoriosapi.path }}"

_serilog: &serilog
  LogCustom:
    Graylog:
      HostnameOrAddress: 187.77.254.127
      Port: 12201
  Serilog:
    MinimumLevel:
      Default: Information
      Override:
        Microsoft: Fatal
        Microsoft.Hosting.Lifetime: Fatal
        Microsoft.AspNetCore.DataProtection.KeyManagement.XmlKeyManager: Fatal
        Serilog.AspNetCore.RequestLoggingMiddleware: Fatal

_token_vs: &token_vs
  TokenConfigurations:
    Audience: VSAudiencePS
    Issuer: VSIssuerPS
    Seconds: 86400

_token_mc: &token_mc
  TokenConfigurations:
    Audience: MonitorClientesVirtualStore
    Issuer: "Ponto.Sys Sistemas"
    HoursExpires: 12

app_settings_common:
  AllowedHosts: "*"
  Logging:
    LogLevel:
      Default: Information
      Microsoft.AspNetCore: Warning

app_settings:
  virtualstore:
    <<: [*serilog, *token_vs]
    UrlApis:
      MonitorClientes: "{{ url_monitorclientesapi }}"
    Links:
      UrlConfirmacaoEmail: "{{ app_public_url }}/#/confirmar-email/"
      UrlRecupecaoSenha: "{{ app_public_url }}/app/#/recuperar-senha/"
    SmtpClientData:
      MailDisplayName: "Ponto.Sys Sistemas"
      MailFrom: naoresponder@pontosys.com
      MailHost: smtpi.kinghost.net
      MailPort: 587
      MailEnableSsl: true
      MailSuportePontoSys: rafael@pontosys.com
    EmailsFinanceiro:
      - elvis@pontosys.com
      - leandro@pontosys.com
      - rafael@pontosys.com

  monitorclientesapi:
    <<: *token_mc

  dashsapi:
    <<: [*serilog, *token_vs]
    UrlApis:
      MonitorClientes: "{{ url_monitorclientesapi }}"

  relatoriosapi:
    <<: [*serilog, *token_vs]
    UrlApis:
      MonitorClientes: "{{ url_monitorclientesapi }}"
      Relatorios: "{{ url_geradorrelatoriosapi }}"

  geradorrelatoriosapi:
    <<: *token_mc

  cadastrosapi:
    <<: [*serilog, *token_vs]
    UrlApis:
      MonitorClientes: "{{ url_monitorclientesapi }}"
      MonitorRelatorios: "{{ url_geradorrelatoriosapi }}"

  entradaapi:
    <<: [*serilog, *token_vs]
    UrlApis:
      MonitorClientes: "{{ url_monitorclientesapi }}"

  pixapi: {}

db_pool_max: 12

