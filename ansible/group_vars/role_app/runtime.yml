---
# ===========================================================================
# APPLICATION VMs — what the host must provide before any app can start
# ===========================================================================

# ---------------------------------------------------------------------------
# .NET RUNTIMES
#
# Both are out of support and neither has a package for Ubuntu 24.04, so each
# one gets its OWN install root instead of the usual side-by-side layout under
# a single /usr/share/dotnet. Reasons, in order of how much they hurt:
#
#   1. Extracting 2.1 after 5.0 into a shared root OVERWRITES the `dotnet`
#      host binary with the older one. It usually still works -- and "usually"
#      is not a property you want under a payment API.
#   2. `dotnet --list-runtimes` on a shared root lists both, so a rollforward
#      mistake in one app silently lands on the other runtime.
#   3. Removing a runtime becomes `rm -rf` on one directory.
#
# Each app's unit gets ExecStart=<root>/dotnet, so the runtime is chosen by
# the drop-in, not by PATH.
#
# icu:
#   host      use the distribution's libicu, told to the runtime through
#             CLR_ICU_VERSION_OVERRIDE (these runtimes only probe up to
#             ICU 67 and Ubuntu 24.04 ships 74, so without the override the
#             process aborts on startup with "Couldn't find a valid ICU").
#   invariant DOTNET_SYSTEM_GLOBALIZATION_INVARIANT=1. Starts anywhere, but
#             pt-BR dates, currency and string comparison degrade to the
#             invariant culture -- wrong output on a Brazilian ERP, so it is
#             a fallback, not a default.
# ---------------------------------------------------------------------------
dotnet_root: /opt/dotnet

dotnet_runtimes:
  "5.0":
    version: "5.0.15"
    icu: host
  "2.1":
    version: "2.1.30"
    icu: host

# Default for an app that does not name one.
dotnet_default_runtime: "5.0"

# ---------------------------------------------------------------------------
# OpenSSL COMPATIBILITY
#
# .NET 5 and .NET Core 2.1 predate OpenSSL 3 and dlopen libssl.so.1.1 by
# soname. Ubuntu 24.04 has OpenSSL 3 only.
#
# The .deb is UNPACKED into a private directory instead of being installed
# with dpkg: installing an end-of-life libssl system-wide hands every process
# on the box an unpatched TLS library. Here only the app units see it, through
# LD_LIBRARY_PATH on the unit.
# ---------------------------------------------------------------------------
dotnet_compat_dir: /opt/dotnet/compat

dotnet_compat_packages:
  - name: libssl1.1
    url: http://security.ubuntu.com/ubuntu/pool/main/o/openssl/libssl1.1_1.1.1f-1ubuntu2.24_amd64.deb
    # Proof the unpack worked: without these two the first HTTPS call throws.
    provides:
      - libssl.so.1.1
      - libcrypto.so.1.1

# ---------------------------------------------------------------------------
# System.Drawing
#
# virtualstore and relatoriosapi set "System.Drawing.EnableUnixSupport": true
# in their runtimeconfig.json -- that switch routes System.Drawing.Common to
# libgdiplus, which is not installed by default and is not a managed
# dependency, so its absence only shows up when a report is generated.
#
# The fonts are the same reason: report layouts reference Arial, Tahoma and
# Orator by name. Missing, libgdiplus substitutes a default face and the
# invoice comes out with the wrong column widths.
# ---------------------------------------------------------------------------
dotnet_drawing_packages:
  - libgdiplus
  - libc6-dev
  - libx11-6

dotnet_fonts_dir: /usr/local/share/fonts/msttcore
dotnet_fonts:
  - arial.ttf
  - arialbd.ttf
  - arialbi.ttf
  - ariali.ttf
  - ariblk.ttf
  - tahoma.ttf
  - tahomabd.ttf
  - ORATOR10.TTF
