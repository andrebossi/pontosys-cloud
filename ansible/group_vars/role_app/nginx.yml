---
# ===========================================================================
# NGINX
#
# One public server on port 80 (the load balancer terminates TLS and is the
# only thing that reaches it), routing BY PATH. Path routing is not a
# preference -- the apps build absolute URLs from it: appsettings has
# UrlApis.MonitorClientes = https://<host>/monitorclientesapi. Host-based
# routing would need every one of those rewritten.
#
# The prefix is passed through to Kestrel intact (no trailing slash on
# proxy_pass), exactly as the previous machine did it.
# ===========================================================================
nginx_listen_port: 80

# The nginx.org repository, not the distribution package: it tracks stable
# upstream instead of Ubuntu's 1.24 freeze, and it is what the official role
# defaults to.
nginx_install_from: nginx_repository
nginx_branch: stable
nginx_user: nginx

# auto = one worker per vCPU. On 1 OCPU that is 2 workers, which is right:
# nginx here is a proxy, not a TLS terminator, and is never the bottleneck.
nginx_worker_processes: auto
nginx_worker_connections: 4096
nginx_worker_rlimit_nofile: 65535

nginx_static_root: /usr/share/nginx/html
nginx_access_log: /var/log/nginx/access.json.log
nginx_error_log: /var/log/nginx/error.log
nginx_error_log_level: warn

# stub_status, bound to loopback. This is what Fluent Bit's nginx_metrics
# input scrapes for connection and request counters -- no nginx-exporter.
nginx_status_port: 8081

# JWTs in an Authorization header overflow the default 8k buffer and nginx
# answers 400 before the request ever reaches Kestrel. Carried over from the
# previous machine, where it was set for the same reason.
nginx_large_client_header_buffers: "4 32k"

# The Flutter and Ionic bundles are megabytes of JS. Compression is the single
# biggest win available for the storefront's first paint.
nginx_gzip:
  enabled: true
  comp_level: 5
  min_length: 1024
  types:
    - text/plain
    - text/css
    - text/javascript
    - application/javascript
    - application/json
    - application/wasm
    - image/svg+xml
    - font/ttf
    - font/woff
    - font/woff2

# Static assets are immutable per release; caching their descriptors avoids a
# stat() per request on a box with one disk.
nginx_open_file_cache: "max=2000 inactive=60s"

# ---------------------------------------------------------------------------
# TIMEOUTS AND BODY LIMITS PER TIER
#
# The old machine used 600s for everything, which meant a hung payment held a
# worker connection for ten minutes. Reports keep the 600s -- rendering a
# 40-page NFe genuinely takes minutes -- and everything else fails fast.
# ---------------------------------------------------------------------------
app_nginx_tiers:
  site:
    connect_timeout: 5s
    read_timeout: 120s
    send_timeout: 120s
    client_max_body_size: 64m
  api:
    connect_timeout: 3s
    read_timeout: 60s
    send_timeout: 60s
    client_max_body_size: 16m
  critical:
    connect_timeout: 2s
    read_timeout: 30s
    send_timeout: 30s
    client_max_body_size: 4m
  batch:
    connect_timeout: 5s
    read_timeout: 600s
    send_timeout: 600s
    client_max_body_size: 128m

# Passive health check: after max_fails errors inside fail_timeout the
# upstream leaves rotation for fail_timeout. Open-source nginx has no active
# check -- this is what exists, and for a loopback upstream it is enough.
app_upstream_max_fails: 3
app_upstream_fail_timeout: 10s
# Kestrel connections held open per worker. Nine upstreams x 16 x 2 workers =
# 288 sockets, well inside the file descriptor limit.
app_upstream_keepalive: 16

# What /readyz proxies. /healthz is a static 200 that only proves the VM is
# serving; this one goes through to a real application and is the deeper check
# a release gate wants. Any HTTP answer means the process is alive.
readyz_app: monitorclientesapi

# Error pages, byte-identical to the previous machine (files/nginx/nginx-config).
nginx_error_pages:
  "404": /404.html
  "50x": /50x.html
