---
# One entry per application. The version is right here: bumping it and running
# deploy.yml is a release, and git is the record of what every environment ran.
#
#   version      the tarball in the bucket: artifacts/<name>/<name>-<version>.tar.gz
#   dll          entry assembly, as produced by dotnet publish
#   port         Kestrel port on 127.0.0.1, the same ones the old machine used
#   path         nginx location prefix, passed through to Kestrel intact
#   tier         resource and timeout class, see app_tiers in platform.yml
#   linked_dirs  state that survives a release; lives in shared/ and is
#                symlinked into each release
#
#   database     the MySQL credential and what it may reach. Both explicit:
#                  secret   the vault name, WITHOUT the <secret_prefix>- half
#                  schemas  connection-string name -> schema. One account can
#                           serve several, which is why they are listed rather
#                           than derived.
#                It is also what database.yml uses to create the account and
#                its grants -- one entry, both sides.
#
#   secrets      anything else the application reads from the vault:
#                  ENV_VAR_NAME: vault-name   (again without the prefix)
#                These are created by hand; see REQUIREMENTS.md.
#
# Every secret an application uses is named here. Nothing is derived from the
# application's name, so grepping for a vault name finds every use of it.

applications:

  virtualstore:
    version: "2026.09.12"
    description: Virtual Store — vendas
    dll: VirtualStore.Vendas.Service.Api.dll
    port: 5000
    path: /virtualstore
    tier: site
    linked_dirs: [logs, Contents, Relatorios]
    database:
      secret: db-virtualstore
      schemas:
        VSGlobalContext: virtualstoreglobal
        CepContext: cep
    secrets:
      SmtpClientData__MailPass: smtp-password

  monitorclientesapi:
    version: "2026.09.12"
    description: Monitor de clientes — global directory
    dll: MonitorClientes.Monitoramento.WebApi.dll
    port: 5002
    path: /monitorclientesapi
    tier: critical
    database:
      secret: db-monitorclientesapi
      schemas:
        MonitoramentoContext: virtualstoreglobal
    secrets:
      TokenConfigurations__Key: jwt-monitorclientes

  dashsapi:
    version: "2026.09.12"
    description: Dashboards
    dll: VirtualStore.Dashboards.Api.dll
    port: 5003
    path: /dashsapi
    tier: api

  relatoriosapi:
    version: "2026.09.12"
    description: Relatórios (NFe/NFCe rendering)
    dll: VirtualStore.Relatorios.Api.dll
    port: 5004
    path: /relatoriosapi
    tier: batch
    linked_dirs: [Relatorios, Fonts]

  geradorrelatoriosapi:
    version: "2026.09.12"
    description: Gerador de relatórios
    dll: MonitorClientes.Relatorio.WebApi.dll
    port: 5005
    path: /geradorrelatoriosapi
    tier: batch
    database:
      secret: db-geradorrelatoriosapi
      schemas:
        RelatoriosContext: virtualstoreglobal
    secrets:
      TokenConfigurations__Key: jwt-monitorclientes

  cadastrosapi:
    version: "2026.09.12"
    description: Cadastros
    dll: VirtualStore.Cadastros.Api.dll
    port: 5006
    path: /cadastrosapi
    tier: api
    linked_dirs: [ArquivosFiscais]
    database:
      secret: db-cadastrosapi
      schemas:
        CepContext: cep

  entradaapi:
    version: "2026.09.12"
    description: Entradas de mercadoria
    dll: VirtualStore.Entradas.API.dll
    port: 5007
    path: /entradaapi
    tier: api
    database:
      secret: db-entradaapi
      schemas:
        VSGlobalContext: virtualstoreglobal
        CepContext: cep

  pixapi:
    version: "2026.09.12"
    description: Integração PIX
    dll: VirtualStore.Integrations.Pix.Api.dll
    port: 5008
    path: /pixapi
    tier: critical
    linked_dirs: [Contents]

# The three frontends in one tarball, unpacked over the document root.
webroot_version: "2026.09.12"

# nginx location -> index. spa: false is deliberate -- try_files would answer
# every unknown path with the shell and a 200, and the error page would never
# fire again. These builds route on the fragment, which never reaches nginx.
static_sites:
  root:
    path: /
    index: /index.html
  app:
    path: /app
    index: /app/index.html
  monitorclientes:
    path: /monitorclientes
    index: /monitorclientes/index.html
