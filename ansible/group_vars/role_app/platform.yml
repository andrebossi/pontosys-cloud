---
# Ceilings, in two levels, so one misbehaving app cannot take the box down
# and the eight of them together cannot either:
#
#   apps.slice                    the group
#     └ dotnet-app@<name>.service  one application

# Everything outside apps.slice. The slice ceilings follow from it.
apps_slice_reserve_mb: 1600

# MemoryHigh is soft -- the kernel throttles and reclaims, which is the window
# where the GC can still react. MemoryMax is hard, and crossing it is an OOM
# kill. CPUQuota is also what makes the kernel fill throttled_usec in cpu.stat.
app_tiers:
  site:
    memory_min: 128M
    memory_high: 700M
    memory_max: 900M
    memory_swap_max: 256M
    cpu_quota: 100%
    cpu_weight: 200
    io_weight: 150

  api:
    memory_min: 96M
    memory_high: 300M
    memory_max: 420M
    memory_swap_max: 128M
    cpu_quota: 60%
    cpu_weight: 100
    io_weight: 100

  critical:
    # Payments and the global directory. No swap: a paged-out payment handler
    # adds seconds to the one request that must not hang.
    memory_min: 128M
    memory_high: 350M
    memory_max: 450M
    memory_swap_max: 0
    cpu_quota: 120%
    cpu_weight: 400
    io_weight: 300

  batch:
    # Report rendering: heavy, bursty, tolerant of being slow. Lowest weights,
    # so a 40-page NFe never delays a sale.
    memory_min: 96M
    memory_high: 500M
    memory_max: 700M
    memory_swap_max: 512M
    cpu_quota: 70%
    cpu_weight: 50
    io_weight: 20

# Applied to every app unit. The COMPlus_ prefix is deliberate: DOTNET_ as a
# runtime-configuration prefix only became valid in .NET 6, and written that
# way here it would be silently ignored.
dotnet_runtime_env:
  # Server GC allocates a heap and a thread per core per process: nine
  # processes on two cores would mean eighteen heaps competing for 4.4 GB.
  # This is the single most important setting on this box.
  COMPlus_gcServer: "0"
  # Percentage of the cgroup limit the GC may use as heap, IN HEXADECIMAL.
  # 4B = 75, leaving room for JIT, loader and stacks inside MemoryMax.
  COMPlus_GCHeapHardLimitPercent: "4B"
  COMPlus_GCConserveMemory: "3"
  COMPlus_gcConcurrent: "0"
  DOTNET_NOLOGO: "1"
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  ASPNETCORE_ENVIRONMENT: "Production"

# One server on port 80 -- the load balancer terminates TLS -- routing by path.
# Path routing is not a preference: the apps build absolute URLs from the
# prefix, so host-based routing would need every one of those rewritten.
nginx_listen_port: 80
# stub_status on loopback, scraped by Fluent Bit's nginx_metrics input.
nginx_status_port: 8081

# What /readyz proxies. /healthz is a static 200 that only proves the VM is
# serving; this one goes through to a real application.
readyz_app: monitorclientesapi

# The old machine used 600s for everything, so a hung payment held a worker for
# ten minutes. Reports keep it; everything else fails fast.
app_nginx_tiers:
  site:
    connect_timeout: 5s
    read_timeout: 120s
    send_timeout: 120s
    client_max_body_size: 64m
  api:
    connect_timeout: 3s
    read_timeout: 60s
    send_timeout: 60s
    client_max_body_size: 16m
  critical:
    connect_timeout: 2s
    read_timeout: 30s
    send_timeout: 30s
    client_max_body_size: 4m
  batch:
    connect_timeout: 5s
    read_timeout: 600s
    send_timeout: 600s
    client_max_body_size: 128m

# The OCI image ships an INPUT chain ending in REJECT.
base_open_ports:
  - "{{ nginx_listen_port }}"
