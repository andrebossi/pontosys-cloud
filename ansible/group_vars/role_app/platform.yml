---
# ===========================================================================
# WHAT THE HOST PROVIDES, AND WHAT AN APPLICATION MAY SPEND
#
# 2 vCPU, 6 GB, nine .NET processes. Nothing here is a measurement of how much
# an app uses -- these are CEILINGS, in two levels, so one misbehaving app
# cannot take the box down and the nine of them together cannot either.
#
#   apps.slice                    ~4.4 GB, the ceiling for the GROUP
#     └ dotnet-app@<name>.service the ceiling for ONE app
# ===========================================================================

# Everything outside apps.slice: kernel, nginx, fluent-bit, and the page cache
# that keeps .dll reads off the disk. Raise it if the box gains a resident
# service; the slice ceilings follow.
apps_slice_reserve_mb: 1600

# MemoryHigh is SOFT: crossing it makes the kernel throttle and reclaim, which
# is the window where the .NET GC still has time to react. MemoryMax is hard,
# and crossing it is an OOM kill. The distance between them is the margin.
#
# CPUQuota is a ceiling; CPUWeight decides who wins a contended core. The
# quota is also what makes the kernel fill throttled_usec in cpu.stat, which
# is where the throttling metric comes from.
app_tiers:
  site:
    memory_min: 128M
    memory_high: 700M
    memory_max: 900M
    memory_swap_max: 256M
    cpu_quota: 100%
    cpu_weight: 200
    io_weight: 150

  api:
    memory_min: 96M
    memory_high: 300M
    memory_max: 420M
    memory_swap_max: 128M
    cpu_quota: 60%
    cpu_weight: 100
    io_weight: 100

  critical:
    # Payments and the global directory. No swap: a paged-out payment handler
    # adds seconds to the one request that must not hang.
    memory_min: 128M
    memory_high: 350M
    memory_max: 450M
    memory_swap_max: 0
    cpu_quota: 120%
    cpu_weight: 400
    io_weight: 300

  batch:
    # Report rendering: heavy, bursty, tolerant of being slow. Lowest weights,
    # so a 40-page NFe never delays a sale.
    memory_min: 96M
    memory_high: 500M
    memory_max: 700M
    memory_swap_max: 512M
    cpu_quota: 70%
    cpu_weight: 50
    io_weight: 20

# ---------------------------------------------------------------------------
# .NET RUNTIMES
#
# Both are out of support and neither has a package for Ubuntu 24.04, so each
# gets its OWN install root. Stacking them under one root overwrites the
# `dotnet` host binary with the older one and makes rollforward depend on what
# was installed last. Each unit names its runtime explicitly.
#
# icu: `host` hands the distribution's libicu over through
# CLR_ICU_VERSION_OVERRIDE -- these runtimes only probe up to ICU 67 and
# Ubuntu 24.04 ships 74, so without it the process aborts on startup.
# `invariant` starts anywhere but degrades pt-BR dates, currency and string
# comparison, so it is a fallback and not a default.
# ---------------------------------------------------------------------------
dotnet_runtimes:
  "5.0":
    version: "5.0.15"
    icu: host
  "2.1":
    version: "2.1.30"
    icu: host

dotnet_default_runtime: "5.0"

# .NET 5 and Core 2.1 dlopen libssl.so.1.1 by soname and Ubuntu 24.04 has
# OpenSSL 3 only. The .deb is UNPACKED into a private directory rather than
# installed: `apt install libssl1.1` would put an unpatched TLS library on the
# search path of every process on the box, sshd included.
# arm64 is published on ports.ubuntu.com, not security.ubuntu.com -- the two
# archives are separate, and the amd64 path 404s for arm64.
dotnet_compat_packages:
  - name: libssl1.1
    url: >-
      {{ 'http://ports.ubuntu.com/ubuntu-ports' if deb_arch == 'arm64'
         else 'http://security.ubuntu.com/ubuntu' }}/pool/main/o/openssl/libssl1.1_1.1.1f-1ubuntu2.24_{{ deb_arch }}.deb
    provides:
      - libssl.so.1.1
      - libcrypto.so.1.1

# Report layouts reference these faces by name. Missing, libgdiplus
# substitutes a default and the invoice comes out with the wrong column
# widths -- a silent corruption, not an error. The files live in
# the `fonts` artifact and are verified against the system font cache after
# they are unpacked.
dotnet_fonts:
  - arial.ttf
  - arialbd.ttf
  - arialbi.ttf
  - ariali.ttf
  - ariblk.ttf
  - tahoma.ttf
  - tahomabd.ttf
  - ORATOR10.TTF

# Applied to every app unit. The COMPlus_ prefix is deliberate: DOTNET_ as a
# runtime-configuration prefix only became valid in .NET 6, and written that
# way here it would be silently ignored.
dotnet_runtime_env:
  # Server GC allocates a heap and a thread per core per process: nine
  # processes on two cores would mean eighteen heaps competing for 4.4 GB.
  # This is the single most important setting on this box.
  COMPlus_gcServer: "0"
  # Percentage of the cgroup limit the GC may use as heap, IN HEXADECIMAL.
  # 4B = 75, leaving room for JIT, loader and stacks inside MemoryMax.
  COMPlus_GCHeapHardLimitPercent: "4B"
  COMPlus_GCConserveMemory: "3"
  COMPlus_gcConcurrent: "0"
  DOTNET_NOLOGO: "1"
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  ASPNETCORE_ENVIRONMENT: "Production"

# ---------------------------------------------------------------------------
# NGINX
#
# One server on port 80 -- the load balancer terminates TLS and is the only
# thing that reaches it -- routing BY PATH. Path routing is not a preference:
# the apps build absolute URLs from the prefix (UrlApis in appsettings), so
# host-based routing would need every one of those rewritten.
# ---------------------------------------------------------------------------
nginx_listen_port: 80
# stub_status on loopback, scraped by Fluent Bit's nginx_metrics input.
nginx_status_port: 8081

# What /readyz proxies. /healthz is a static 200 that only proves the VM is
# serving; this one goes through to a real application.
readyz_app: monitorclientesapi

# The old machine used 600s for everything, so a hung payment held a worker
# connection for ten minutes. Reports keep it -- rendering a 40-page NFe
# genuinely takes minutes -- and everything else fails fast.
app_nginx_tiers:
  site:
    connect_timeout: 5s
    read_timeout: 120s
    send_timeout: 120s
    client_max_body_size: 64m
  api:
    connect_timeout: 3s
    read_timeout: 60s
    send_timeout: 60s
    client_max_body_size: 16m
  critical:
    connect_timeout: 2s
    read_timeout: 30s
    send_timeout: 30s
    client_max_body_size: 4m
  batch:
    connect_timeout: 5s
    read_timeout: 600s
    send_timeout: 600s
    client_max_body_size: 128m

# The OCI Ubuntu image ships an INPUT chain ending in REJECT. This is what
# cloud-init used to open; it belongs with the rest of the host configuration.
# The status port stays closed -- Fluent Bit scrapes it over loopback.
base_open_ports:
  - "{{ nginx_listen_port }}"
