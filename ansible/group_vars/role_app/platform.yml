---
# Ceilings, in two levels, so one misbehaving app cannot take the box down
# and the eight of them together cannot either:
#
#   apps.slice                    the group
#     └ dotnet-app@<name>.service  one application

# MemoryHigh is soft -- the kernel throttles and reclaims, which is the window
# where the GC can still react. MemoryMax is hard, and crossing it is an OOM
# kill. CPUQuota is also what makes the kernel fill throttled_usec in cpu.stat.
app_tiers:
  site:
    memory_min: 128M
    memory_high: 700M
    memory_max: 900M
    memory_swap_max: 256M
    cpu_quota: 100%
    cpu_weight: 200
    io_weight: 150

  api:
    memory_min: 96M
    memory_high: 300M
    memory_max: 420M
    memory_swap_max: 128M
    cpu_quota: 60%
    cpu_weight: 100
    io_weight: 100

  critical:
    memory_min: 128M
    memory_high: 350M
    memory_max: 450M
    memory_swap_max: 0
    cpu_quota: 120%
    cpu_weight: 400
    io_weight: 300

  batch:
    memory_min: 96M
    memory_high: 500M
    memory_max: 700M
    memory_swap_max: 512M
    cpu_quota: 70%
    cpu_weight: 50
    io_weight: 20

dotnet_runtime_env:
  COMPlus_gcServer: "0"
  COMPlus_GCHeapHardLimitPercent: "4B"
  COMPlus_GCConserveMemory: "3"
  COMPlus_gcConcurrent: "0"
  DOTNET_NOLOGO: "1"
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  ASPNETCORE_ENVIRONMENT: "Production"

nginx_listen_port: 80
nginx_access_log: /var/log/nginx/access.json.log
nginx_status_port: 8081

readyz_app: monitorclientesapi

app_nginx_tiers:
  site:
    connect_timeout: 5s
    read_timeout: 120s
    send_timeout: 120s
    client_max_body_size: 64m
  api:
    connect_timeout: 3s
    read_timeout: 60s
    send_timeout: 60s
    client_max_body_size: 16m
  critical:
    connect_timeout: 2s
    read_timeout: 30s
    send_timeout: 30s
    client_max_body_size: 4m
  batch:
    connect_timeout: 5s
    read_timeout: 600s
    send_timeout: 600s
    client_max_body_size: 128m

# The OCI image ships an INPUT chain ending in REJECT.
base_open_ports:
  - "{{ nginx_listen_port }}"
