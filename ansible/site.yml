---
# Full convergence. Idempotent: safe to run against a live fleet.
#
#   ansible-playbook site.yml                      everything
#   ansible-playbook site.yml --check --diff       dry run
#   ansible-playbook site.yml --tags nginx         one layer
#   ansible-playbook site.yml --limit 10.20.16.5   one machine

- name: Host baseline
  hosts: all
  become: true
  roles:
    - role: base
      tags: [base]
    - role: observability_agent
      tags: [observability]

# Server-side, so one machine is enough -- and it has to be an application VM:
# the NSG only lets the app tier reach the database on 3306. Runs before the
# applications so a first converge does not start them against accounts that do
# not exist yet.
- name: Database accounts
  hosts: role_app
  become: true
  gather_facts: false
  tags: [db]
  tasks:
    - name: One account per application
      ansible.builtin.include_role:
        name: db_users
      run_once: true

- name: Application layer
  hosts: role_app
  become: true
  # One VM at a time. The instance pool sits behind a load balancer, and a
  # simultaneous nginx reload on every backend is a visible outage.
  serial: 1
  roles:
    - role: dotnet_runtime
      tags: [dotnet, runtime]
    - role: nginx_app
      tags: [nginx]
    - role: dotnet_app
      tags: [dotnet, apps]

- name: Observability backend
  hosts: role_monitoring
  become: true
  roles:
    - role: monitoring_stack
      tags: [monitoring]
