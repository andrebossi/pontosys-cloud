---
# The application servers.
#
#   ansible-playbook -i inventories/production site.yml
#   ansible-playbook -i inventories/rc site.yml
#   ansible-playbook -i inventories/production site.yml --tags nginx
- name: Application servers
  hosts: role_app
  become: true
  serial: 1
  roles:
    - { role: base, tags: [base] }
    - { role: dotnet_runtime, tags: [runtime] }
    - { role: nginx_app, tags: [nginx] }
    - { role: dotnet_app, tags: [apps] }
    - { role: app_deploy, tags: [apps, deploy] }
    - { role: observability_agent, tags: [agent] }
