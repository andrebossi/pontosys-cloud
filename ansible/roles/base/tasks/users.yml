---
- name: Operational accounts
  ansible.builtin.user:
    name: "{{ item.key }}"
    comment: "{{ item.value.comment }}"
    groups: "{{ item.value.groups | default([]) }}"
    append: true
    shell: /bin/bash
    create_home: true
    password: "!"
    password_lock: true
  loop: "{{ base_users | dict2items }}"
  loop_control:
    label: "{{ item.key }}"

- name: Authorized keys
  ansible.posix.authorized_key:
    user: "{{ item.0.key }}"
    key: "{{ item.1 }}"
    exclusive: true
    state: present
  loop: "{{ base_users | dict2items | subelements('value.ssh_keys', skip_missing=True) }}"
  loop_control:
    label: "{{ item.0.key }}"

- name: sudo rules
  ansible.builtin.copy:
    dest: "/etc/sudoers.d/10-{{ item.key }}"
    mode: "0440"
    validate: "visudo -cf %s"
    content: |
      # {{ ansible_managed }}
      # {{ item.value.comment }}
      {% for rule in item.value.sudo %}
      {{ item.key }} ALL=(ALL) NOPASSWD: {{ rule }}
      {% endfor %}
  loop: "{{ base_users | dict2items }}"
  loop_control:
    label: "{{ item.key }}"
  when: item.value.sudo | default([]) | length > 0

