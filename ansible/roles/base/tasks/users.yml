---
# Three accounts, three jobs. Nothing logs in as root and nothing runs an
# application as a human.
#
#   dotnetapp  runs the applications. nologin, no sudo, owns /srv/apps.
#   deploy     the automation identity. Ansible connects as this.
#   ops        humans, for looking at a machine that is misbehaving.
#
# The honest limit: `deploy` has full sudo, because Ansible's modules run as
# root and a command allowlist that covers them is an allowlist for root. What
# it buys is that automation is a separate, keyed, non-interactive account with
# its own audit trail -- not a shared login. `ops` is where the restriction is
# real: its allowlist is short enough to read, and most of what it needs is
# group membership rather than sudo at all.

- name: Service account for the applications
  ansible.builtin.user:
    name: "{{ app_deploy_user }}"
    system: true
    shell: /usr/sbin/nologin
    home: "{{ app_deploy_root }}"
    create_home: false
    password_lock: true

- name: Operational accounts
  ansible.builtin.user:
    name: "{{ item.key }}"
    comment: "{{ item.value.comment }}"
    groups: "{{ item.value.groups | default([]) }}"
    append: true
    shell: /bin/bash
    create_home: true
    # No password, ever: these are key-only accounts. An unset password with
    # PasswordAuthentication on would let anyone in, so it is explicitly locked.
    password: "!"
    password_lock: true
  loop: "{{ base_users | dict2items }}"
  loop_control:
    label: "{{ item.key }}"

- name: Authorized keys
  ansible.posix.authorized_key:
    user: "{{ item.0.key }}"
    key: "{{ item.1 }}"
    exclusive: true
    state: present
  loop: "{{ base_users | dict2items | subelements('value.ssh_keys', skip_missing=True) }}"
  loop_control:
    label: "{{ item.0.key }}"

- name: sudo rules
  ansible.builtin.copy:
    dest: "/etc/sudoers.d/10-{{ item.key }}"
    mode: "0440"
    # visudo -cf: a malformed file here locks every account out of sudo, and
    # the failure only shows up the next time someone needs it.
    validate: "visudo -cf %s"
    content: |
      # {{ ansible_managed }}
      # {{ item.value.comment }}
      {% for rule in item.value.sudo %}
      {{ item.key }} ALL=(ALL) NOPASSWD: {{ rule }}
      {% endfor %}
  loop: "{{ base_users | dict2items }}"
  loop_control:
    label: "{{ item.key }}"
  when: item.value.sudo | default([]) | length > 0

# ops reads the app trees to check what a release actually contains, and reads
# nothing else it does not already own.
- name: ops can read the application trees
  ansible.posix.acl:
    path: "{{ app_deploy_root }}"
    entity: ops
    etype: user
    permissions: rx
    default: true
    recursive: true
    state: present
  when: "'ops' in base_users"
