---
# A file, not a partition: the boot volume is the only disk and a file can be
# resized without touching the partition table.
- name: Swapfile exists
  ansible.builtin.command:
    cmd: "fallocate -l {{ swap_size_mb }}M {{ swap_file }}"
    creates: "{{ swap_file }}"
  register: swap_created

- name: Swapfile is private
  ansible.builtin.file:
    path: "{{ swap_file }}"
    owner: root
    group: root
    mode: "0600"

- name: Swapfile is formatted
  ansible.builtin.command: "mkswap {{ swap_file }}"
  when: swap_created is changed
  changed_when: true

- name: Swapfile in fstab
  ansible.posix.mount:
    name: none
    src: "{{ swap_file }}"
    fstype: swap
    opts: sw,nofail
    state: present

- name: Swap is on
  ansible.builtin.command: "swapon {{ swap_file }}"
  when: swap_created is changed
  changed_when: true
  failed_when: false
