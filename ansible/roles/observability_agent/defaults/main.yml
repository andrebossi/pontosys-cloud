---
fluentbit_bin: /opt/fluent-bit/bin/fluent-bit

fluentbit_config_dir: /etc/fluent-bit
fluentbit_state_dir: /var/lib/fluent-bit
fluentbit_textfile_dir: /var/lib/node_exporter/textfile

fluentbit_memory_max: 96M
fluentbit_cpu_quota: 15%

fluentbit_http_port: 2020

fluentbit_extra_inputs: []
fluentbit_extra_filters: []
fluentbit_extra_outputs: []
fluentbit_backend_inputs: []
fluentbit_backend_filters: []
fluentbit_backend_outputs: []
fluentbit_extra_files: []
textfile_exporters: []

fluentbit_base_inputs:
  - name: node_exporter_metrics
    tag: node_metrics
    scrape_interval: 30
    metrics: cpu,meminfo,diskstats,filesystem,loadavg,vmstat,stat,time,uname,netdev,filefd,systemd,textfile
    collector.textfile.path: /var/lib/node_exporter/textfile
    collector.textfile.scrape_interval: 30
    systemd_include_pattern: (dotnet-app@.+\.service|nginx\.service|fluent-bit\.service|ssh\.service)
    systemd_service_restart_metrics: true
    systemd_unit_start_time_metrics: true
    diskstats.ignore_device_regex: ^(ram|loop|fd|dm-)\d+$
    filesystem.ignore_mount_point_regex: ^/(dev|proc|sys|run)($|/)
    threaded: "on"

  - name: fluentbit_metrics
    tag: fb_metrics
    scrape_interval: 30

  - name: systemd
    tag: host.err
    systemd_filter:
      - PRIORITY=0
      - PRIORITY=1
      - PRIORITY=2
      - PRIORITY=3
      - _SYSTEMD_UNIT=systemd-oomd.service
    systemd_filter_type: or
    strip_underscores: true
    read_from_tail: true
    max_entries: 500
    db: /var/lib/fluent-bit/systemd-host.db
    storage.type: filesystem
    threaded: "on"

fluentbit_base_filters:
  - name: record_modifier
    match: "*"
    record:
      - instance_id ${INSTANCE_ID}
      - instance_name ${INSTANCE_NAME}
      - fault_domain ${FD}
      - role ${ROLE}
      - release ${RELEASE}

  - name: modify
    match: host.err
    add: job host

  - name: record_modifier
    match_regex: ^(host\.err|app\.log)$
    remove_key:
      - BOOT_ID
      - MACHINE_ID
      - CAP_EFFECTIVE
      - SYSTEMD_CGROUP
      - SYSTEMD_INVOCATION_ID
      - SYSTEMD_SLICE
      - SOURCE_REALTIME_TIMESTAMP
      - SELINUX_CONTEXT
      - AUDIT_SESSION
      - AUDIT_LOGINUID
      - STREAM_ID
      - SYSLOG_FACILITY

fluentbit_base_outputs:
  - name: prometheus_remote_write
    match_regex: ^(node_metrics|fb_metrics|nginx_metrics|nginx_req_metrics|backend_metrics)$
    host: "{{ monitoring_endpoints.metrics.host }}"
    port: "{{ monitoring_endpoints.metrics.port }}"
    uri: "{{ monitoring_endpoints.metrics.uri }}"
    add_label:
      - instance ${INSTANCE_ID}
      - fault_domain ${FD}
      - job oci-${ROLE}
    retry_limit: 5
    storage.total_limit_size: 256M

  - name: http
    match: host.err
    host: "{{ monitoring_endpoints.logs.host }}"
    port: "{{ monitoring_endpoints.logs.port }}"
    uri: "{{ monitoring_endpoints.logs.uri }}?{{ vl_query }}&_stream_fields=instance_name,job,unit"
    format: json_lines
    json_date_format: iso8601
    compress: gzip
    retry_limit: 5
    storage.total_limit_size: 256M
