---
- name: Official Fluent Bit repository
  ansible.builtin.deb822_repository:
    name: fluent-bit
    types: [deb]
    uris: "https://packages.fluentbit.io/ubuntu/{{ ansible_facts['distribution_release'] }}"
    suites: "{{ ansible_facts['distribution_release'] }}"
    components: [main]
    signed_by: https://packages.fluentbit.io/fluentbit.key
    state: present

- name: Install the agent
  ansible.builtin.apt:
    name: fluent-bit
    state: present
    update_cache: true

# A drop-in, never a copy of the unit in /etc: that would mask the packaged one
# and an upgrade changing ExecStart would be silently ignored.
- name: No local copy shadowing it
  ansible.builtin.file:
    path: /etc/systemd/system/fluent-bit.service
    state: absent
  notify: restart fluent-bit

- name: Service user
  ansible.builtin.user:
    name: fluent-bit
    system: true
    shell: /usr/sbin/nologin
    create_home: false

- name: Directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: fluent-bit
    group: fluent-bit
    mode: "0755"
  loop:
    - "{{ fluentbit_state_dir }}"
    - "{{ fluentbit_state_dir }}/storage"
    - "{{ fluentbit_textfile_dir }}"

- name: Parsers
  ansible.builtin.template:
    src: parsers.yaml.j2
    dest: "{{ fluentbit_config_dir }}/parsers.yaml"
    mode: "0644"
  notify: reload fluent-bit

- name: Lua scripts
  ansible.builtin.copy:
    src: "{{ item }}"
    dest: "{{ fluentbit_config_dir }}/{{ item }}"
    mode: "0644"
  loop: "{{ fluentbit_extra_files }}"
  notify: reload fluent-bit

# The node_exporter_metrics textfile collector reads this directory. It is the
# bridge for what the agent does not collect on its own: per-cgroup memory,
# swap and pressure, which is where an approaching OOM shows up first.
- name: Textfile exporters
  ansible.builtin.copy:
    src: "{{ item.src }}"
    dest: "/usr/local/bin/{{ item.src }}"
    mode: "0755"
  loop: "{{ textfile_exporters }}"
  loop_control: { label: "{{ item.name }}" }

- name: Exporter units and timers
  ansible.builtin.copy:
    dest: "/etc/systemd/system/textfile-{{ item.0.name }}.{{ item.1 }}"
    mode: "0644"
    content: |
      [Unit]
      Description=Textfile collection ({{ item.0.name }})

      {% if item.1 == 'timer' %}
      [Timer]
      OnBootSec=30s
      OnUnitActiveSec={{ item.0.interval }}s

      [Install]
      WantedBy=timers.target
      {% else %}
      [Service]
      Type=oneshot
      ExecStart=/usr/local/bin/{{ item.0.src }}
      Nice=10
      IOWeight=20
      MemoryMax=64M
      {% endif %}
  loop: "{{ textfile_exporters | product(['service', 'timer']) | list }}"
  loop_control: { label: "textfile-{{ item.0.name }}.{{ item.1 }}" }

- name: Drop-in directory
  ansible.builtin.file:
    path: /etc/systemd/system/fluent-bit.service.d
    state: directory
    mode: "0755"

- name: Agent drop-in
  ansible.builtin.template:
    src: fluent-bit-dropin.conf.j2
    dest: /etc/systemd/system/fluent-bit.service.d/10-pscloud.conf
    mode: "0644"
  notify: restart fluent-bit

# validate runs before the file is written: an invalid configuration never
# reaches disk, so the agent keeps running with the last good one.
- name: Configuration
  ansible.builtin.template:
    src: fluent-bit.yaml.j2
    dest: "{{ fluentbit_config_dir }}/fluent-bit.yaml"
    mode: "0644"
    validate: "{{ fluentbit_bin }} --dry-run -c %s"
  notify: reload fluent-bit

- name: Agent is running
  ansible.builtin.systemd:
    name: fluent-bit
    state: started
    enabled: true
    daemon_reload: true

- name: Exporter timers are running
  ansible.builtin.systemd:
    name: "textfile-{{ item.name }}.timer"
    state: started
    enabled: true
    daemon_reload: true
  loop: "{{ textfile_exporters }}"
  loop_control: { label: "{{ item.name }}" }

- name: Agent is serving
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ fluentbit_http_port }}/api/v1/health"
    status_code: 200
  register: fb_health
  retries: 6
  delay: 5
  until: fb_health is succeeded
  changed_when: false
