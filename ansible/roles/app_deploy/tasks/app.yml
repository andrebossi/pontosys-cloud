---
- name: "{{ app_name }}"
  vars:
    app: "{{ applications[app_name] | combine({'version': resolved_version[app_name]}) }}"
    home: "{{ app_deploy_root }}/{{ app_name }}"
    release: "{{ app_deploy_root }}/{{ app_name }}/releases/{{ resolved_version[app_name] }}"
  block:
    - name: "{{ app_name }} — release directory"
      ansible.builtin.file:
        path: "{{ release }}"
        state: directory
        owner: "{{ app_deploy_user }}"
        group: "{{ app_deploy_user }}"
        mode: "0755"

    - name: Artifact cache on the controller
      ansible.builtin.file:
        path: "{{ artifact_cache }}"
        state: directory
        mode: "0700"
      delegate_to: localhost
      become: false
      run_once: true
      changed_when: false

    - name: "{{ app_name }} — namespace"
      oracle.oci.oci_object_storage_namespace_facts:
        auth_type: "{{ oci_auth_type }}"
      delegate_to: localhost
      become: false
      run_once: true
      changed_when: false
      register: ns
      when: oci_namespace is not defined

    - name: "{{ app_name }} — remember it"
      ansible.builtin.set_fact:
        oci_namespace: "{{ ns.namespace }}"
      when: oci_namespace is not defined

    - name: "{{ app_name }} — download {{ app.version }}"
      oracle.oci.oci_object_storage_object:
        namespace_name: "{{ oci_namespace }}"
        bucket_name: "{{ artifact_bucket }}"
        object_name: "artifacts/{{ app_name }}/{{ app_name }}-{{ app.version }}.tar.gz"
        dest: "{{ artifact_cache }}/{{ app_name }}-{{ app.version }}.tar.gz"
        state: present
      delegate_to: localhost
      become: false
      changed_when: false

    - name: "{{ app_name }} — unpack"
      ansible.builtin.unarchive:
        src: "{{ artifact_cache }}/{{ app_name }}-{{ app.version }}.tar.gz"
        dest: "{{ release }}"
        owner: "{{ app_deploy_user }}"
        group: "{{ app_deploy_user }}"
        extra_opts: [--no-same-owner]
        creates: "{{ release }}/{{ app.dll }}"

    - name: "{{ app_name }} — owner"
      ansible.builtin.file:
        path: "{{ release }}"
        state: directory
        owner: "{{ app_deploy_user }}"
        group: "{{ app_deploy_user }}"
        recurse: true

    - name: "{{ app_name }} — link state and settings"
      ansible.builtin.file:
        path: "{{ release }}/{{ item }}"
        src: "{{ home }}/shared/{{ item }}"
        state: link
        force: true
        owner: "{{ app_deploy_user }}"
        group: "{{ app_deploy_user }}"
      loop: "{{ (app.linked_dirs | default([])) + ['appsettings.Production.json'] }}"

    - name: "{{ app_name }} — what is running now"
      ansible.builtin.stat:
        path: "{{ home }}/current"
      register: current

    - name: "{{ app_name }} — switch to {{ app.version }}"
      ansible.builtin.file:
        path: "{{ home }}/current"
        src: "{{ release }}"
        state: link
        owner: "{{ app_deploy_user }}"
        group: "{{ app_deploy_user }}"

    - name: "{{ app_name }} — restart"
      ansible.builtin.systemd:
        name: "dotnet-app@{{ app_name }}.service"
        state: restarted
        enabled: true
        daemon_reload: true
      when: not app_bake | bool

    - name: "{{ app_name }} — answers on 127.0.0.1:{{ app.port }}"
      ansible.builtin.uri:
        url: "http://127.0.0.1:{{ app.port }}/"
        status_code: [200, 201, 204, 301, 302, 400, 401, 403, 404, 405]
      register: health
      retries: "{{ app_health_retries }}"
      delay: "{{ app_health_delay }}"
      until: health is succeeded
      when: not app_bake | bool

    - name: "{{ app_name }} — keep the last {{ app_releases_keep }} releases"
      ansible.builtin.shell:
        cmd: cd {{ home }}/releases && ls -1dt */ | tail -n +{{ app_releases_keep + 1 }} | xargs -r rm -rf
      changed_when: true

  rescue:
    - name: "{{ app_name }} — roll back"
      ansible.builtin.file:
        path: "{{ home }}/current"
        src: "{{ current.stat.lnk_target }}"
        state: link
      when: current.stat.lnk_target is defined

    - name: "{{ app_name }} — restart the previous release"
      ansible.builtin.systemd:
        name: "dotnet-app@{{ app_name }}.service"
        state: restarted
      when: current.stat.lnk_target is defined and not app_bake | bool
      failed_when: false

    - name: "{{ app_name }} — journal"
      ansible.builtin.command: "journalctl -u dotnet-app@{{ app_name }}.service -n 50 --no-pager"
      register: journal
      changed_when: false
      failed_when: false

    - name: "{{ app_name }} — failed"
      ansible.builtin.fail:
        msg: |
          {{ app_name }} {{ app.version }} failed.
          {{ 'Rolled back to ' ~ current.stat.lnk_target if current.stat.lnk_target is defined
             else 'Nothing was running before.' }}

          {{ journal.stdout }}
