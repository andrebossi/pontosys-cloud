---
# The application VMs hold NO credential for Object Storage and have no OCI
# tooling installed. The machine that orchestrates the deploy mints a
# read-only, single-object, short-lived URL, and the target fetches it with
# plain HTTP. That is the whole reason the bucket beats pulling from GitHub:
# an autoscaled VM never needs a token of its own.
- name: "{{ app_name }} — download URL for {{ artifact_object }}"
  ansible.builtin.command: "/usr/local/bin/release par {{ artifact_object }} --ttl {{ app_par_ttl }}"
  delegate_to: "{{ app_release_host }}"
  register: artifact_par
  changed_when: false
  no_log: true

- name: "{{ app_name }} — fetch {{ app_ver }}"
  ansible.builtin.get_url:
    url: "{{ artifact_par.stdout | trim }}"
    dest: "{{ artifact_local }}"
    mode: "0640"
  no_log: true
