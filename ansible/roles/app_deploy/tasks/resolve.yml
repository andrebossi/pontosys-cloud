---
# Version resolution, run ONCE for the whole fleet before any machine is
# touched. Deliberately not inside the serial deploy play: with a serial
# rollout each batch is its own play, and `latest` would be re-resolved per
# batch -- a publish landing mid-rollout would split the fleet across two
# versions with nothing to show for it.

# delegate_to reaches a host outside the run's --limit perfectly well, but the
# play that INSTALLS the CLI is itself narrowed by that limit.
- name: The CLI is installed on {{ app_release_host }}
  ansible.builtin.stat:
    path: /usr/local/bin/pscloud
  delegate_to: "{{ app_release_host }}"
  run_once: true
  register: release_cli
  when: artifact_store == 'bucket'

- name: Say so plainly if it is not
  ansible.builtin.assert:
    that: release_cli.stat.exists
    fail_msg: >-
      /usr/local/bin/pscloud is missing on {{ app_release_host }}. It is
      installed by the first play of deploy.yml, which a --limit of
      "{{ ansible_limit | default('(none)') }}" excluded. Run it once:
      ansible-playbook release.yml
    quiet: true
  run_once: true
  when: artifact_store == 'bucket'

- name: An explicit version was given
  ansible.builtin.set_fact:
    app_versions: "{{ dict(deploy_apps | zip([app_version] * (deploy_apps | length))) }}"
  when: app_version | length > 0

- name: Versions from the {{ app_env }} manifest
  when:
    - app_version | length == 0
    - app_version_source == 'manifest'
  block:
    - name: Read it
      ansible.builtin.command: "/usr/local/bin/pscloud show {{ app_env }} --release {{ app_manifest }} --json"
      delegate_to: "{{ app_release_host }}"
      run_once: true
      register: manifest_json
      changed_when: false

    - name: Use it
      ansible.builtin.set_fact:
        app_versions: "{{ (manifest_json.stdout | from_json).apps }}"

    # A manifest that does not mention an app being deployed is a gap between
    # the catalog and what CI published; skipping it silently is how a machine
    # ends up serving a version nobody chose.
    - name: Every requested application is pinned
      ansible.builtin.assert:
        that: deploy_apps | difference(app_versions.keys() | list) | length == 0
        fail_msg: >-
          Manifest {{ app_manifest }} for {{ app_env }} does not pin:
          {{ deploy_apps | difference(app_versions.keys() | list) | join(', ') }}.
          Publish them, or narrow the run with -e deploy_apps=[...].
        quiet: true

- name: Newest version of each application in the store
  when:
    - app_version | length == 0
    - app_version_source == 'latest'
  run_once: true
  block:
    - name: Ask the bucket
      ansible.builtin.command: "/usr/local/bin/pscloud latest {{ item }}"
      loop: "{{ deploy_apps }}"
      delegate_to: "{{ app_release_host }}"
      register: bucket_latest
      changed_when: false
      when: artifact_store == 'bucket'

    # Emits JSON rather than lines: from_json is core, and a `split` filter is
    # not portable across ansible-core versions.
    - name: Ask {{ local_artifact_dir }}
      ansible.builtin.shell:
        cmd: |
          sep=; printf '{'
          for n in {{ deploy_apps | join(' ') }}; do
            f=$(ls -1t "{{ local_artifact_dir }}/$n/$n-"*.tar.gz 2>/dev/null | head -1)
            [ -n "$f" ] || continue
            v=$(basename "$f" .tar.gz)
            printf '%s"%s":"%s"' "$sep" "$n" "${v#"$n"-}"
            sep=,
          done
          printf '}'
        executable: /bin/bash
      delegate_to: localhost
      become: false
      changed_when: false
      register: local_latest
      when: artifact_store == 'local'

    - name: Use them
      ansible.builtin.set_fact:
        app_versions: >-
          {{ dict(deploy_apps | zip(bucket_latest.results | map(attribute='stdout') | map('trim')))
             if artifact_store == 'bucket'
             else (local_latest.stdout | from_json) }}

    - name: Every application has one
      ansible.builtin.assert:
        that: deploy_apps | difference(app_versions.keys() | list) | length == 0
        fail_msg: >-
          No artifact for:
          {{ deploy_apps | difference(app_versions.keys() | list) | join(', ') }}.
          Publish with `pscloud push <app> <version> <file>`, or drop it in
          {{ local_artifact_dir }}/<app>/ when artifact_store=local.
        quiet: true

- name: What this run will install
  ansible.builtin.debug:
    msg: "{{ app_env }}: {{ app_versions | dict2items | map('join', ' ') | join(', ') }}"
  run_once: true
