---
- name: "{{ app_name }}"
  vars:
    app: "{{ applications[app_name] }}"
    app_ver: "{{ app_versions[app_name] }}"
    app_home: "{{ app_deploy_root }}/{{ app_name }}"
    release_dir: "{{ app_deploy_root }}/{{ app_name }}/releases/{{ app_versions[app_name] }}"
  block:

    - name: "{{ app_name }} — fetch and unpack {{ app_ver }}"
      ansible.builtin.include_role:
        name: artifact
        tasks_from: fetch.yml
      vars:
        artifact_name: "{{ app_name }}"
        artifact_version: "{{ app_ver }}"
        artifact_dest: "{{ release_dir }}"
        artifact_owner: "{{ app_deploy_user }}"
        artifact_group: "{{ app_deploy_user }}"
        artifact_creates: "{{ release_dir }}/{{ app.dll }}"

    # A tarball built from the parent directory unpacks one level too deep and
    # the assembly lands at releases/<ver>/publish/App.dll. Caught here, with a
    # message that says so, instead of as an opaque unit failure after the
    # switch. Pack with: tar -C bin/Release/net5.0/publish -czf app.tar.gz .
    - name: "{{ app_name }} — the entry assembly is where the unit expects it"
      ansible.builtin.stat:
        path: "{{ release_dir }}/{{ app.dll }}"
      register: entry_dll
      failed_when: not entry_dll.stat.exists

    # State that outlives the release: client certificates, generated reports,
    # fiscal tables. The release tree is otherwise immutable.
    - name: "{{ app_name }} — link persistent directories"
      ansible.builtin.file:
        path: "{{ release_dir }}/{{ item }}"
        src: "{{ app_home }}/shared/{{ item }}"
        state: link
        force: true
        owner: "{{ app_deploy_user }}"
        group: "{{ app_deploy_user }}"
      loop: "{{ app.linked_dirs | default([]) }}"

    - name: "{{ app_name }} — link the environment settings"
      ansible.builtin.file:
        path: "{{ release_dir }}/appsettings.Production.json"
        src: "{{ app_home }}/shared/appsettings.Production.json"
        state: link
        force: true
        owner: "{{ app_deploy_user }}"
        group: "{{ app_deploy_user }}"

    # Recorded before the switch so the rescue block can put it back.
    - name: "{{ app_name }} — what is running now"
      ansible.builtin.stat:
        path: "{{ app_home }}/current"
      register: current_link

    - name: "{{ app_name }} — remember it"
      ansible.builtin.set_fact:
        previous_release: "{{ current_link.stat.lnk_target | default('') }}"

    # Replacing a symlink is atomic: there is no instant where `current`
    # points at a half-unpacked tree.
    - name: "{{ app_name }} — switch current to {{ app_ver }}"
      ansible.builtin.file:
        path: "{{ app_home }}/current"
        src: "{{ release_dir }}"
        state: link
        owner: "{{ app_deploy_user }}"
        group: "{{ app_deploy_user }}"

    # An image build has no running systemd for the app: the unit is baked and
    # enabled, and starts on the first boot of a real instance.
    - name: "{{ app_name }} — restart"
      ansible.builtin.systemd:
        name: "dotnet-app@{{ app_name }}.service"
        state: restarted
        enabled: true
        daemon_reload: true
      when: not app_bake | bool

    # Type=exec reports "started" as soon as execve succeeds, which says
    # nothing about whether Kestrel is listening. Any HTTP response proves the
    # listener is up: a 404 on / is a working API with no route there, a
    # refused connection is a dead app.
    - name: "{{ app_name }} — answers on 127.0.0.1:{{ app.port }}"
      ansible.builtin.uri:
        url: "http://127.0.0.1:{{ app.port }}{{ app_deploy_health_path }}"
        status_code: [200, 201, 204, 301, 302, 400, 401, 403, 404, 405]
      register: app_health
      retries: "{{ app_deploy_health_retries }}"
      delay: "{{ app_deploy_health_delay }}"
      until: app_health is succeeded
      changed_when: false
      when: not app_bake | bool

    - name: "{{ app_name }} — keep the last {{ app_releases_keep }} releases"
      ansible.builtin.shell:
        cmd: >-
          set -o pipefail;
          cd {{ app_home }}/releases &&
          ls -1dt */ | tail -n +{{ app_releases_keep + 1 }} | xargs -r rm -rf
        executable: /bin/bash
      changed_when: true

  rescue:
    # Automatic: the alternative is leaving a broken release live while
    # someone reads the error.
    - name: "{{ app_name }} — roll back to {{ previous_release | default('(nothing)') }}"
      ansible.builtin.file:
        path: "{{ app_home }}/current"
        src: "{{ previous_release }}"
        state: link
        owner: "{{ app_deploy_user }}"
        group: "{{ app_deploy_user }}"
      when: previous_release | default('') | length > 0

    - name: "{{ app_name }} — restart the previous release"
      ansible.builtin.systemd:
        name: "dotnet-app@{{ app_name }}.service"
        state: restarted
      when:
        - previous_release | default('') | length > 0
        - not app_bake | bool
      failed_when: false

    - name: "{{ app_name }} — what the unit said"
      ansible.builtin.command: "journalctl -u dotnet-app@{{ app_name }}.service -n 50 --no-pager"
      register: failed_journal
      changed_when: false
      failed_when: false

    - name: "{{ app_name }} — deploy failed"
      ansible.builtin.fail:
        msg: |
          Deploy of {{ app_name }} {{ app_versions[app_name] | default('?') }} failed.
          {{ 'Rolled back to ' ~ previous_release if previous_release | default('') | length > 0
             else 'Nothing was running before, so nothing was rolled back.' }}

          Last 50 journal lines:
          {{ failed_journal.stdout | default('(journal unavailable)') }}
