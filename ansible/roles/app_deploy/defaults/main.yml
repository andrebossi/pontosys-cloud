---
# Which applications this run touches. One app is -e "deploy_apps=['pixapi']".
deploy_apps: "{{ applications.keys() | list }}"

app_deploy_root: /srv/apps
app_deploy_user: dotnetapp
app_releases_keep: 5

# True during a Packer build: unpack and switch, but start nothing -- there is
# no live service on a builder.
app_bake: false

app_health_retries: 12
app_health_delay: 5
