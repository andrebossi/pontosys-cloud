---
- name: Accounts matching {{ db_user_pattern }}
  ansible.mysql.mysql_query:
    login_host: "{{ db_admin.host }}"
    login_port: "{{ db_admin.port }}"
    login_user: "{{ db_admin.username }}"
    login_password: "{{ db_admin.password }}"
    query: "SELECT user, host FROM mysql.user WHERE user LIKE %(pattern)s"
    named_args:
      pattern: "{{ db_user_pattern }}"
  register: existing_users
  changed_when: false
  no_log: true

- name: Which of them no application claims
  ansible.builtin.set_fact:
    orphan_users: >-
      {{ existing_users.query_result | first
         | rejectattr('user', 'in', claimed) | list }}
  vars:
    claimed: >-
      {{ db_apps | map(attribute='key') | map('extract', db_secrets)
         | map(attribute='username') | list }}

- name: Remove them
  ansible.mysql.mysql_user:
    login_host: "{{ db_admin.host }}"
    login_port: "{{ db_admin.port }}"
    login_user: "{{ db_admin.username }}"
    login_password: "{{ db_admin.password }}"
    name: "{{ item.user }}"
    host: "{{ item.host }}"
    state: absent
  loop: "{{ orphan_users }}"
  loop_control:
    label: "{{ item.user }}@{{ item.host }}"
  no_log: true
