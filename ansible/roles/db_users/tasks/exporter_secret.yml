---
- name: "exporter — read"
  oracle.oci.oci_secrets_secret_bundle_facts:
    secret_name: "{{ secret_prefix }}-mysql-exporter"
    vault_id: "{{ oci_vault_id }}"
    stage: CURRENT
    auth_type: "{{ oci_auth_type }}"
  delegate_to: localhost
  become: false
  register: exporter_bundle
  ignore_errors: true
  changed_when: false
  no_log: true

- name: "exporter — generate"
  when: exporter_bundle is failed or db_exporter_rotate | bool
  no_log: true
  block:
    - ansible.builtin.set_fact:
        exporter_dsn:
          host: "{{ db_admin.host }}"
          port: "{{ db_admin.port }}"
          username: exporter
          password: "{{ lookup('password', '/dev/null length=' ~ db_secret_length ~ ' chars=ascii_letters,digits') }}"
          host_acl: "{{ db_exporter_host_acl }}"

    - name: "exporter — store in the vault"
      oracle.oci.oci_vault_secret:
        secret_id: "{{ exporter_bundle.secret_bundle.secret_id | default(omit) }}"
        compartment_id: "{{ compartment_ocid }}"
        vault_id: "{{ oci_vault_id }}"
        key_id: "{{ oci_vault_key_id }}"
        secret_name: "{{ secret_prefix }}-mysql-exporter"
        description: "MySQL credential for mysqld_exporter, managed by ansible"
        secret_content:
          content_type: BASE64
          content: "{{ exporter_dsn | to_json | b64encode }}"
        state: present
        auth_type: "{{ oci_auth_type }}"
      delegate_to: localhost
      become: false

- name: "exporter — read what already existed"
  when: exporter_bundle is succeeded and not db_exporter_rotate | bool
  ansible.builtin.set_fact:
    exporter_dsn: >-
      {{ exporter_bundle.secret_bundle.secret_bundle_content.content
         | b64decode | from_json }}
  no_log: true

- name: "exporter — correct where it points"
  when: exporter_bundle is succeeded and not db_exporter_rotate | bool and exporter_fixed != exporter_dsn
  vars:
    exporter_fixed: >-
      {{ exporter_dsn | combine({'host': db_admin.host, 'port': db_admin.port | int,
                                 'host_acl': db_exporter_host_acl}) }}
  no_log: true
  block:
    - name: "exporter — store the corrected credential"
      oracle.oci.oci_vault_secret:
        secret_id: "{{ exporter_bundle.secret_bundle.secret_id }}"
        compartment_id: "{{ compartment_ocid }}"
        vault_id: "{{ oci_vault_id }}"
        key_id: "{{ oci_vault_key_id }}"
        secret_name: "{{ secret_prefix }}-mysql-exporter"
        description: "MySQL credential for mysqld_exporter, managed by ansible"
        secret_content:
          content_type: BASE64
          content: "{{ exporter_fixed | to_json | b64encode }}"
        state: present
        auth_type: "{{ oci_auth_type }}"
      delegate_to: localhost
      become: false

    - name: "exporter — use it"
      ansible.builtin.set_fact:
        exporter_dsn: "{{ exporter_fixed }}"
