---
- name: Vault is configured
  ansible.builtin.assert:
    that: oci_vault_id | default('') | length > 0
    fail_msg: >-
      oci_vault_id is empty. It comes from OCI_VAULT_OCID; see
      .env.example, then `source keys/.env`.
    quiet: true

- name: Administrative credential
  oracle.oci.oci_secrets_secret_bundle_facts:
    secret_name: "{{ secret_prefix }}-mysql-admin"
    vault_id: "{{ oci_vault_id }}"
    stage: CURRENT
    auth_type: "{{ oci_auth_type }}"
  delegate_to: localhost
  become: false
  register: admin_bundle
  changed_when: false
  retries: 5
  delay: 15
  until: admin_bundle is succeeded
  no_log: true

- name: Administrative connection
  ansible.builtin.set_fact:
    db_admin: >-
      {{ admin_bundle.secret_bundle.secret_bundle_content.content
         | b64decode | from_json }}
  no_log: true

- name: Read the application credentials that exist
  oracle.oci.oci_secrets_secret_bundle_facts:
    secret_name: "{{ secret_prefix }}-{{ item.value.database.secret }}"
    vault_id: "{{ oci_vault_id }}"
    stage: CURRENT
    auth_type: "{{ oci_auth_type }}"
  delegate_to: localhost
  become: false
  loop: "{{ db_apps }}"
  loop_control:
    label: "{{ item.value.database.secret }}"
  register: app_bundles
  ignore_errors: true
  changed_when: false
  no_log: true

- name: What came back
  ansible.builtin.set_fact:
    db_secrets: >-
      {{ dict(app_bundles.results | rejectattr('failed') | map(attribute='item.key')
              | zip(app_bundles.results | rejectattr('failed')
                    | map(attribute='secret_bundle.secret_bundle_content.content')
                    | map('b64decode') | map('from_json'))) }}
    missing_apps: >-
      {{ app_bundles.results | selectattr('failed') | map(attribute='item.key') | list }}
    db_secret_ids: >-
      {{ dict(app_bundles.results | rejectattr('failed') | map(attribute='item.key')
              | zip(app_bundles.results | rejectattr('failed')
                    | map(attribute='secret_bundle.secret_id'))) }}
  no_log: true

- name: Credentials that point at the wrong place
  ansible.builtin.set_fact:
    db_secrets_fixed: "{{ db_secrets_fixed | default({}) | combine({item.key: fixed}) }}"
  vars:
    fixed: >-
      {{ item.value | dict2items | rejectattr('key', 'equalto', 'grants') | items2dict
         | combine({'host': db_admin.host, 'port': db_admin.port | int, 'host_acl': db_user_host}) }}
  loop: "{{ db_secrets | dict2items }}"
  loop_control:
    label: "{{ item.key }}"
  when: fixed != item.value
  no_log: true

- name: Store the corrected credentials
  oracle.oci.oci_vault_secret:
    secret_id: "{{ db_secret_ids[item.key] }}"
    compartment_id: "{{ compartment_ocid }}"
    vault_id: "{{ oci_vault_id }}"
    key_id: "{{ oci_vault_key_id }}"
    secret_name: "{{ secret_prefix }}-{{ applications[item.key].database.secret }}"
    description: "MySQL credential for {{ item.key }}, managed by ansible"
    secret_content:
      content_type: BASE64
      content: "{{ item.value | to_json | b64encode }}"
    state: present
    auth_type: "{{ oci_auth_type }}"
  delegate_to: localhost
  become: false
  loop: "{{ db_secrets_fixed | default({}) | dict2items }}"
  loop_control:
    label: "{{ item.key }}"
  no_log: true

- name: Use them from here on
  ansible.builtin.set_fact:
    db_secrets: "{{ db_secrets | combine(db_secrets_fixed | default({})) }}"
  no_log: true

- name: Corrected in the vault
  ansible.builtin.debug:
    msg: "{{ db_secrets_fixed | default({}) | list or 'nothing to correct' }}"

- name: Mint the ones that do not exist
  ansible.builtin.include_tasks: credential.yml
  loop: "{{ missing_apps }}"
  loop_control:
    loop_var: app_key

- name: Rotate
  ansible.builtin.include_tasks: credential.yml
  loop: "{{ db_apps | map(attribute='key') | difference(missing_apps) }}"
  loop_control:
    loop_var: app_key
  when: db_rotate | bool

- name: Exporter credential
  ansible.builtin.include_tasks: exporter_secret.yml
  when: db_create_exporter_user | bool
