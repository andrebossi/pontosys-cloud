---
- name: "{{ app_key }} — generate"
  vars:
    app: "{{ applications[app_key] }}"
  ansible.builtin.set_fact:
    new_dsn:
      host: "{{ db_admin.host }}"
      port: "{{ db_admin.port }}"
      database: "{{ app.database.schemas.values() | first }}"
      username: "{{ app_key }}{{ db_user_suffix }}"
      password: "{{ lookup('password', '/dev/null length=' ~ db_secret_length ~ ' chars=ascii_letters,digits') }}"
      host_acl: "{{ db_user_host }}"
  no_log: true

- name: "{{ app_key }} — store in the vault"
  oracle.oci.oci_vault_secret:
    compartment_id: "{{ compartment_ocid }}"
    vault_id: "{{ oci_vault_id }}"
    key_id: "{{ oci_vault_key_id }}"
    secret_name: "{{ secret_prefix }}-{{ applications[app_key].database.secret }}"
    description: "MySQL credential for {{ app_key }}, managed by ansible"
    secret_content:
      content_type: BASE64
      content: "{{ new_dsn | to_json | b64encode }}"
    state: present
    auth_type: "{{ oci_auth_type }}"
  delegate_to: localhost
  become: false
  no_log: true

- name: "{{ app_key }} — keep it for this run"
  ansible.builtin.set_fact:
    db_secrets: "{{ db_secrets | combine({app_key: new_dsn}) }}"
  no_log: true
