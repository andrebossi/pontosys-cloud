---
# One application at a time, so each gets its own password: a lookup inside a
# filter chain is evaluated once and every credential would come out identical.
#
# The document shape is the contract with dotnet_app, which reads host, port,
# username and password out of it and needs nothing else to build a connection
# string. It matches the administrative secret, so there is one shape to know.
- name: "{{ app_key }} — generate"
  vars:
    app: "{{ applications[app_key] }}"
  ansible.builtin.set_fact:
    new_dsn:
      host: "{{ db_admin.host }}"
      port: "{{ db_admin.port }}"
      # The first schema is the connection default; the account is granted on
      # all of them below.
      database: "{{ app.database.schemas.values() | first }}"
      username: "{{ app_key }}{{ db_user_suffix }}"
      password: "{{ lookup('password', '/dev/null length=' ~ db_secret_length ~ ' chars=ascii_letters,digits') }}"
      host_acl: "{{ db_user_host }}"
  no_log: true

# state: present on a name that already exists adds a VERSION rather than
# replacing the secret, which is what keeps the previous password readable
# until something explicitly moves off it.
- name: "{{ app_key }} — store in the vault"
  oracle.oci.oci_vault_secret:
    compartment_id: "{{ compartment_ocid }}"
    vault_id: "{{ oci_vault_id }}"
    key_id: "{{ oci_vault_key_id }}"
    secret_name: "{{ secret_prefix }}-{{ applications[app_key].database.secret }}"
    description: "MySQL credential for {{ app_key }}, managed by ansible"
    secret_content:
      content_type: BASE64
      content: "{{ new_dsn | to_json | b64encode }}"
    state: present
    auth_type: "{{ oci_auth_type }}"
  delegate_to: localhost
  become: false
  no_log: true

- name: "{{ app_key }} — keep it for this run"
  ansible.builtin.set_fact:
    db_secrets: "{{ db_secrets | combine({app_key: new_dsn}) }}"
  no_log: true
