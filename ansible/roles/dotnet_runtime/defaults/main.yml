---
dotnet_root: /opt/dotnet
dotnet_compat_dir: /opt/dotnet/compat
dotnet_fonts_dir: /usr/local/share/fonts/msttcore

dotnet_runtimes: {}
dotnet_compat_packages: []
dotnet_fonts: []

# The font bundle in the artifact store. Pinned, not `latest`: an image build
# that silently picked up a new set of faces would change every report it
# renders without anything in git saying so.
fonts_artifact: fonts
fonts_version: "1"

# dotnetcli.azureedge.net was retired in 2024; this CDN still serves
# out-of-support versions.
dotnet_download_base: https://builds.dotnet.microsoft.com/dotnet

# The OCI application VMs are x86_64; a local test VM on an ARM laptop is not.
# Everything architecture-specific -- the runtime tarball, the OpenSSL .deb,
# the multiarch library directory -- derives from this one fact.
dotnet_arch: "{{ {'x86_64': 'x64', 'aarch64': 'arm64'}[ansible_architecture] }}"
deb_arch: "{{ {'x86_64': 'amd64', 'aarch64': 'arm64'}[ansible_architecture] }}"

# The ASP.NET Core runtime, not the base one: it carries both shared
# frameworks plus the host, which is exactly what a framework-dependent web
# app needs. The SDK is deliberately absent -- nothing compiles on this box.
dotnet_package: aspnetcore-runtime

dotnet_drawing_packages:
  - libgdiplus
  - libc6-dev
  - libx11-6
  - fontconfig

# The families the report layouts ask for BY NAME, as they are actually
# recorded in the fonts bundle in the artifact store. Orator's family is
# "Orator10 BT", not "Orator": a layout asking for the latter silently gets a
# substitute face and the invoice comes out with shifted columns.
dotnet_font_families:
  - Arial
  - Arial Black
  - Tahoma
  - Orator10 BT

# Computed from the catalog, but overridable: the golden image bakes drawing
# support in unconditionally.
dotnet_install_drawing: "{{ applications | default({}) | dict2items | selectattr('value.drawing', 'defined') | selectattr('value.drawing') | list | length > 0 }}"
