---
dotnet_root: /opt/dotnet
dotnet_compat_dir: /opt/dotnet/compat
dotnet_runtimes: {}
dotnet_compat_packages: []
dotnet_drawing_packages: []
dotnet_fonts: []
dotnet_fonts_dir: /usr/local/share/fonts/msttcore

# Where the tarballs come from. dotnetcli.azureedge.net was retired in 2024;
# this is the current CDN and it still serves out-of-support versions.
dotnet_download_base: https://builds.dotnet.microsoft.com/dotnet

# Install the ASP.NET Core runtime, not the base one: it carries both shared
# frameworks (Microsoft.NETCore.App and Microsoft.AspNetCore.App) plus the
# host, which is exactly what a framework-dependent web app needs and nothing
# more. The SDK is deliberately absent -- nothing compiles on this box.
dotnet_package: aspnetcore-runtime

# Any app on the host needs System.Drawing support. Computed by the role from
# the catalog, but overridable for the golden image, which bakes it in
# unconditionally.
dotnet_install_drawing: "{{ applications | default({}) | dict2items | selectattr('value.drawing', 'defined') | selectattr('value.drawing') | list | length > 0 }}"
