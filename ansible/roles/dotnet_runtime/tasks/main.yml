---
- name: Runtime dependencies
  ansible.builtin.apt:
    name:
      - ca-certificates
      - libicu74
      - libgssapi-krb5-2
      - libstdc++6
      - zlib1g
      # System.Drawing.Common on Linux wraps libgdiplus, which is not a managed
      # dependency: it is absent until installed, and only a rendered report
      # notices.
      - libgdiplus
      - libc6-dev
      - fontconfig
    state: present
    update_cache: true
    cache_valid_time: 3600

# .NET 5 probes libicuuc.so up to 67 and Ubuntu 24.04 ships 74, so the version
# is handed over explicitly. Detected, so a distribution upgrade does not break
# globalization on every app at once.
- name: Host ICU version
  ansible.builtin.shell:
    cmd: ls /usr/lib/{{ ansible_facts['architecture'] }}-linux-gnu/libicuuc.so.* | sed -E 's/.*so\.([0-9]+).*/\1/' | sort -rn | head -1
  register: host_icu
  changed_when: false

- name: ICU version for the unit drop-ins
  ansible.builtin.set_fact:
    dotnet_host_icu_version: "{{ host_icu.stdout | trim }}"

- name: OpenSSL 1.1 package
  ansible.builtin.get_url:
    url: "{{ libssl_url }}"
    dest: /var/cache/libssl1.1.deb
    mode: "0644"
  register: libssl_deb

- name: Unpack it, private to the app units
  ansible.builtin.shell:
    cmd: |
      set -e
      rm -rf /tmp/libssl && mkdir -p /tmp/libssl {{ dotnet_compat_dir }}/lib
      dpkg-deb -x /var/cache/libssl1.1.deb /tmp/libssl
      find /tmp/libssl -name 'lib*.so.1.1' -exec cp -a {} {{ dotnet_compat_dir }}/lib/ \;
      rm -rf /tmp/libssl
    creates: "{{ dotnet_compat_dir }}/lib/libssl.so.1.1"

- name: Install root
  ansible.builtin.file:
    path: "{{ dotnet_root }}"
    state: directory
    mode: "0755"

# Unpacked in the order they are listed, oldest first: the bundles overlap in
# the muxer and in host/fxr, and `dotnet` loads the highest hostfxr it finds,
# which is the one that can start both frameworks.
- name: ASP.NET Core runtimes
  ansible.builtin.unarchive:
    src: "https://builds.dotnet.microsoft.com/dotnet/aspnetcore/Runtime/{{ item }}/aspnetcore-runtime-{{ item }}-linux-{{ dotnet_arch }}.tar.gz"
    dest: "{{ dotnet_root }}"
    remote_src: true
    extra_opts: [--no-same-owner]
    creates: "{{ dotnet_root }}/shared/Microsoft.AspNetCore.App/{{ item }}"
  loop: "{{ dotnet_versions }}"

- name: Every runtime starts
  ansible.builtin.command: "{{ dotnet_root }}/dotnet --list-runtimes"
  environment:
    LD_LIBRARY_PATH: "{{ dotnet_compat_dir }}/lib"
  register: dotnet_runtimes_out
  changed_when: false
  failed_when: dotnet_versions
               | map('regex_replace', '^', 'Microsoft.AspNetCore.App ')
               | reject('in', dotnet_runtimes_out.stdout)
               | list | length > 0

# Report layouts reference Arial, Tahoma and Orator by name. Missing, libgdiplus
# substitutes a default face and invoices come out with the wrong column widths.
- name: Fonts
  ansible.builtin.copy:
    src: fonts/
    dest: "{{ dotnet_fonts_dir }}/"
    mode: "0644"
  register: fonts

- name: Font cache
  ansible.builtin.command: "fc-cache -f {{ dotnet_fonts_dir }}"
  when: fonts is changed
  changed_when: true

# fc-match always answers, so the answer is what matters: a family that is not
# installed resolves to DejaVu and every report renders with the wrong metrics.
- name: Fonts resolve to the installed files
  # argv, not a string: `command` splits a string on whitespace, so the family
  # "Orator10 BT" arrived as two patterns and fc-match answered with nothing.
  ansible.builtin.command:
    argv: [fc-match, "--format=%{file}", "{{ item }}"]
  loop: [Arial, Tahoma, "Orator10 BT"]
  register: fc
  changed_when: false
  failed_when: not fc.stdout.startswith(dotnet_fonts_dir)
