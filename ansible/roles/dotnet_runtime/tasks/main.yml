---
- name: Native dependencies
  ansible.builtin.apt:
    name:
      - ca-certificates
      - libc6
      - libgcc-s1
      - libgssapi-krb5-2
      - libstdc++6
      - zlib1g
      - libicu74
    state: present
    update_cache: true
    cache_valid_time: 3600

# These runtimes probe libicuuc.so.<n> from 67 downwards and Ubuntu 24.04 ships
# 74, so the version has to be handed over explicitly. Detected rather than
# hardcoded, so a distribution upgrade does not silently break globalization on
# every app at once.
- name: Host ICU version
  ansible.builtin.shell:
    cmd: >-
      set -o pipefail;
      ls /usr/lib/{{ ansible_architecture }}-linux-gnu/libicuuc.so.* 2>/dev/null
      | sed -E 's/.*libicuuc\.so\.([0-9]+).*/\1/' | sort -rn | head -1
    executable: /bin/bash
  register: host_icu
  changed_when: false
  failed_when: host_icu.stdout | trim == ""

- name: ICU version is a fact for the unit drop-ins
  ansible.builtin.set_fact:
    dotnet_host_icu_version: "{{ host_icu.stdout | trim }}"

- name: OpenSSL 1.1, private to the app units
  ansible.builtin.include_tasks: compat.yml

- name: Runtimes
  ansible.builtin.include_tasks: runtime.yml
  loop: "{{ dotnet_runtimes | dict2items }}"
  loop_control:
    loop_var: rt
    label: "{{ rt.key }} -> {{ rt.value.version }}"

- name: System.Drawing support
  ansible.builtin.include_tasks: drawing.yml
  when: dotnet_install_drawing | bool
