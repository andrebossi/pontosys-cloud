---
- name: Native runtime dependencies
  ansible.builtin.apt:
    name:
      - ca-certificates
      - libc6
      - libgcc-s1
      - libgssapi-krb5-2
      - libstdc++6
      - zlib1g
      - libicu-dev
    state: present
    update_cache: true

- name: libssl1.1 (missing since Ubuntu 22.04)
  when: dotnet_needs_libssl11 | bool
  block:
    - name: Download the package
      ansible.builtin.get_url:
        url: "{{ dotnet_libssl11_url }}"
        dest: /tmp/libssl1.1.deb
        mode: "0644"

    - name: Install
      ansible.builtin.apt:
        deb: /tmp/libssl1.1.deb
        state: present

- name: ASP.NET Core Runtime {{ dotnet_version }}
  ansible.builtin.unarchive:
    src: "https://builds.dotnet.microsoft.com/dotnet/aspnetcore/Runtime/{{ dotnet_version }}/aspnetcore-runtime-{{ dotnet_version }}-linux-x64.tar.gz"
    dest: "{{ dotnet_install_dir }}"
    remote_src: true
    creates: "{{ dotnet_install_dir }}/shared/Microsoft.AspNetCore.App/{{ dotnet_version }}"
    extra_opts: [--no-same-owner]

- name: Link in /usr/bin
  ansible.builtin.file:
    src: "{{ dotnet_install_dir }}/dotnet"
    dest: /usr/bin/dotnet
    state: link

- name: Runtime responds
  ansible.builtin.command: dotnet --list-runtimes
  register: dotnet_runtimes
  changed_when: false
  failed_when: dotnet_version not in dotnet_runtimes.stdout


- name: libssl.so.1.1 present and loadable
  ansible.builtin.command: ldconfig -p
  register: ldconfig_out
  changed_when: false
  failed_when: "'libssl.so.1.1' not in ldconfig_out.stdout"
  when: dotnet_needs_libssl11 | bool

- name: The .NET crypto provider finds the right OpenSSL
  ansible.builtin.shell:
    cmd: >-
      set -o pipefail;
      strings {{ dotnet_install_dir }}/shared/Microsoft.NETCore.App/{{ dotnet_version }}/libSystem.Security.Cryptography.Native.OpenSsl.so
      | grep -qE 'libssl\.so\.1\.1|OPENSSL_1_1'
    executable: /bin/bash
  changed_when: false
