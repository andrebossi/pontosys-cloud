---
# Resolves every credential and leaves two facts behind:
#
#   db_app_passwords   app -> password, generated on first use
#   app_secret_values  secret name -> value
#
# Included by db_users and dotnet_app, guarded on db_app_passwords, so a
# converge resolves them once.
- name: Credentials
  ansible.builtin.include_tasks: "{{ secrets_backend }}.yml"
