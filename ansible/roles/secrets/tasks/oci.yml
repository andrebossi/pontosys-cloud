---
# Resolves every credential from OCI Vault and leaves two facts behind:
#
#   db_app_passwords   app -> password. Generated here on first run and
#                      written to the vault; read back on every run after.
#   app_secret_values  secret name -> value, for app_secret_refs.
#
# Included by db_users and dotnet_app, guarded on db_app_passwords, so a
# converge resolves them once.

- name: A vault is configured
  ansible.builtin.assert:
    that:
      - oci_vault_id | length > 0
      - oci_vault_key_id | length > 0
    fail_msg: >-
      Set OCI_VAULT_OCID and OCI_VAULT_KEY_OCID (terraform output vault_id /
      vault_key_id). Every credential this fleet uses is stored there.
    quiet: true

- name: Secrets these applications need
  ansible.builtin.set_fact:
    db_secret_apps: >-
      {{ applications | dict2items | rejectattr('value.connections', 'undefined')
         | rejectattr('value.connections', 'eq', {}) | map(attribute='key') | list }}

- name: Names to resolve
  ansible.builtin.set_fact:
    # Generated if absent.
    generated_secrets: >-
      {{ dict(db_secret_apps | map('regex_replace', '^', secret_prefix ~ '-db-' ~ db_user_prefix)
              | zip(db_secret_apps)) }}
    # Must already exist -- set by whoever owns the credential.
    required_secrets: >-
      {{ ([secret_prefix ~ '-db-admin']
          + (app_secret_refs.values() | map('dict2items') | flatten
             | map(attribute='value') | list)) | unique }}

- name: What the vault holds
  oracle.oci.oci_vault_secret_facts:
    auth_type: "{{ oci_secrets_auth }}"
    config_profile_name: "{{ oci_secrets_profile | default(omit, true) }}"
    compartment_id: "{{ compartment_ocid }}"
    vault_id: "{{ oci_vault_id }}"
    lifecycle_state: ACTIVE
  register: vault_index
  delegate_to: localhost
  become: false
  run_once: true

- name: Create the ones that are missing
  oracle.oci.oci_vault_secret:
    auth_type: "{{ oci_secrets_auth }}"
    config_profile_name: "{{ oci_secrets_profile | default(omit, true) }}"
    compartment_id: "{{ compartment_ocid }}"
    vault_id: "{{ oci_vault_id }}"
    key_id: "{{ oci_vault_key_id }}"
    secret_name: "{{ item }}"
    description: "Database password for {{ generated_secrets[item] }}"
    secret_content:
      content_type: BASE64
      content: >-
        {{ lookup('password', '/dev/null length=' ~ secret_password_length
                  ~ ' chars=ascii_letters,digits') | b64encode }}
    state: present
  loop: "{{ generated_secrets.keys() | difference(vault_index.secrets | map(attribute='secret_name') | list) }}"
  delegate_to: localhost
  become: false
  run_once: true
  no_log: true
  register: secrets_created

- name: Re-read the index after a create
  oracle.oci.oci_vault_secret_facts:
    auth_type: "{{ oci_secrets_auth }}"
    config_profile_name: "{{ oci_secrets_profile | default(omit, true) }}"
    compartment_id: "{{ compartment_ocid }}"
    vault_id: "{{ oci_vault_id }}"
    lifecycle_state: ACTIVE
  register: vault_index
  delegate_to: localhost
  become: false
  run_once: true
  when: secrets_created is changed

- name: Every required secret exists
  ansible.builtin.assert:
    that: required_secrets | difference(vault_index.secrets | map(attribute='secret_name') | list) | length == 0
    fail_msg: >-
      Missing from the vault:
      {{ required_secrets | difference(vault_index.secrets | map(attribute='secret_name') | list) | join(', ') }}.
      These are not generated -- create them once with
      `oci vault secret create-base64 --secret-name <name> ...`.
    quiet: true

- name: Read them
  oracle.oci.oci_secrets_secret_bundle_facts:
    auth_type: "{{ oci_secrets_auth }}"
    config_profile_name: "{{ oci_secrets_profile | default(omit, true) }}"
    secret_id: "{{ item.id }}"
    stage: CURRENT
  loop: "{{ vault_index.secrets | selectattr('secret_name', 'in',
            generated_secrets.keys() | list + required_secrets) | list }}"
  loop_control:
    label: "{{ item.secret_name }}"
  delegate_to: localhost
  become: false
  run_once: true
  no_log: true
  register: bundles

- name: Facts
  ansible.builtin.set_fact:
    vault_values: >-
      {{ dict(bundles.results | map(attribute='item.secret_name')
              | zip(bundles.results
                    | map(attribute='secret_bundle.secret_bundle_content.content')
                    | map('b64decode'))) }}
  no_log: true

- name: Credentials
  ansible.builtin.set_fact:
    db_app_passwords: >-
      {{ dict(generated_secrets.values()
              | zip(generated_secrets.keys() | map('extract', vault_values))) }}
    db_admin_password: "{{ vault_values[secret_prefix ~ '-db-admin'] }}"
    app_secret_values: "{{ vault_values }}"
  no_log: true
