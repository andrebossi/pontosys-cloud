---
# No cloud account, no vault: one JSON file on the control node, 0600, holding
# whatever this machine has already generated. Anything missing is generated
# here and written back, so a fresh laptop and a fresh set of VMs come up
# working with nothing to set up first.
#
# This is for local VMs only. `secrets_backend: oci` is what prod uses, and
# group_vars/env_local.yml is the only place that selects this one.

- name: Names to resolve
  ansible.builtin.set_fact:
    wanted_secrets: >-
      {{ (applications | dict2items
          | rejectattr('value.connections', 'undefined')
          | rejectattr('value.connections', 'eq', {})
          | map(attribute='key')
          | map('regex_replace', '^', secret_prefix ~ '-db-' ~ db_user_prefix) | list)
         + [secret_prefix ~ '-db-admin']
         + (app_secret_refs.values() | map('dict2items') | flatten
            | map(attribute='value') | list) | unique }}

- name: The store exists
  ansible.builtin.file:
    path: "{{ local_secrets_file | dirname }}"
    state: directory
    mode: "0700"
  delegate_to: localhost
  become: false
  run_once: true

- name: Read it
  ansible.builtin.slurp:
    src: "{{ local_secrets_file }}"
  delegate_to: localhost
  become: false
  run_once: true
  register: local_store
  failed_when: false
  no_log: true

- name: What is already in it
  ansible.builtin.set_fact:
    vault_values: "{{ (local_store.content | b64decode | from_json)
                      if local_store.content is defined else {} }}"
  no_log: true

# One task per missing secret, not one expression producing all of them: a
# lookup inside a `map` is evaluated ONCE and every secret comes out with the
# same value. A loop calls it again per item.
- name: Generate what is missing
  ansible.builtin.set_fact:
    vault_values: >-
      {{ vault_values | combine({item: lookup('password', '/dev/null length='
         ~ secret_password_length ~ ' chars=ascii_letters,digits')}) }}
  loop: "{{ wanted_secrets | difference(vault_values.keys() | list) }}"
  loop_control:
    label: "{{ item }}"
  no_log: true

- name: Write it back
  ansible.builtin.copy:
    content: "{{ vault_values | to_nice_json }}\n"
    dest: "{{ local_secrets_file }}"
    mode: "0600"
  delegate_to: localhost
  become: false
  run_once: true
  no_log: true

- name: Credentials
  ansible.builtin.set_fact:
    db_app_passwords: >-
      {{ dict(db_secret_apps | zip(db_secret_apps
              | map('regex_replace', '^', secret_prefix ~ '-db-' ~ db_user_prefix)
              | map('extract', vault_values))) }}
    db_admin_password: "{{ vault_values[secret_prefix ~ '-db-admin'] }}"
    app_secret_values: "{{ vault_values }}"
  vars:
    db_secret_apps: >-
      {{ applications | dict2items | rejectattr('value.connections', 'undefined')
         | rejectattr('value.connections', 'eq', {}) | map(attribute='key') | list }}
  no_log: true

- name: Where they live
  ansible.builtin.debug:
    msg: >-
      {{ vault_values | length }} credentials in {{ local_secrets_file }}
      (mode 0600, on the control node). Delete the file to rotate everything.
  run_once: true
