---
# oci | local
#
# oci    OCI Vault. Nothing is kept in git and there is no ansible-vault file.
# local  a 0600 JSON file on the control node, generated on first use. For
#        local VMs, where there is no cloud account to authenticate to.
secrets_backend: oci

local_secrets_file: "{{ lookup('env', 'HOME') }}/.pscloud/secrets-{{ app_env | default('local') }}.json"

#
# Auth follows the machine: an API-key profile when one is named, otherwise
# the instance principal of the host running this (the monitoring VM), which
# is granted `manage secret-family` by infra/modules/identity.
oci_secrets_profile: "{{ lookup('env', 'OCI_CLI_PROFILE') }}"
oci_secrets_auth: "{{ 'api_key' if oci_secrets_profile | length > 0 else 'instance_principal' }}"

oci_vault_id: "{{ lookup('env', 'OCI_VAULT_OCID') }}"
oci_vault_key_id: "{{ lookup('env', 'OCI_VAULT_KEY_OCID') }}"

secret_password_length: 32

applications: {}
db_user_prefix: app_
# name -> secret, read-only. Generated secrets are handled separately.
app_secret_refs: {}
