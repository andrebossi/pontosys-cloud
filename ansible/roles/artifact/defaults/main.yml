---
# bucket | local
#
# bucket   the OCI object store, reached through a short-lived pre-authenticated
#          URL minted by the release host. The target needs no credential.
# local    a directory on the control node. This is what makes the whole thing
#          runnable against VMs with no OCI account at all.
artifact_store: bucket

# Where `local` reads from, on the control node.
local_artifact_dir: "{{ lookup('env', 'HOME') }}/pscloud-artifacts"

# Lifetime of the download URL. Long enough for a slow unpack on a small box,
# short enough that a leaked log line is worthless by the time anyone reads it.
artifact_par_ttl: 900

artifact_owner: root
artifact_group: root
artifact_creates: ""
artifact_tmp: "/var/cache/{{ artifact_name }}-{{ artifact_version }}.tar.gz"
