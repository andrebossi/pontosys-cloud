name: pscloud-observability

x-common: &common
  restart: unless-stopped
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

services:
  victoriametrics:
    <<: *common
    image: victoriametrics/victoria-metrics:v1.151.0
    volumes:
      - vm-data:/storage
    command:
      - --storageDataPath=/storage
      - --httpListenAddr=:8428
      - --retentionPeriod=${VM_RETENTION:-10d}
      - --storage.minFreeDiskSpaceBytes=${VM_MIN_FREE_DISK:-10GB}
      - --memory.allowedBytes=${VM_MEM_ALLOWED:-1400MB}
      - --search.maxConcurrentRequests=${VM_MAX_QUERIES:-4}
      - --search.maxQueryDuration=30s
      - --loggerLevel=WARN
    ports:
      - "127.0.0.1:8428:8428"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8428/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: ${VM_MEM_LIMIT:-2G}
          cpus: "${VM_CPUS:-1.0}"

  victorialogs:
    <<: *common
    image: victoriametrics/victoria-logs:v1.52.0
    volumes:
      - vl-data:/storage
    command:
      - --storageDataPath=/storage
      - --httpListenAddr=:9428
      - --retentionPeriod=${VL_RETENTION:-10d}
      - --retention.maxDiskUsagePercent=${VL_MAX_DISK_PCT:-80}
      - --memory.allowedBytes=${VL_MEM_ALLOWED:-1400MB}
      - --insert.maxFieldsPerLine=200
      - --loggerLevel=WARN
    ports:
      - "127.0.0.1:9428:9428"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:9428/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: ${VL_MEM_LIMIT:-2G}
          cpus: "${VL_CPUS:-0.8}"

  vmalert:
    <<: *common
    image: victoriametrics/vmalert:v1.151.0
    depends_on:
      victoriametrics:
        condition: service_healthy
    volumes:
      - ./alerts:/etc/alerts:ro
    command:
      - --datasource.url=http://victoriametrics:8428
      - --remoteWrite.url=http://victoriametrics:8428
      - --remoteRead.url=http://victoriametrics:8428
      - --notifier.url=http://alertmanager:9093
      - --rule=/etc/alerts/app/*.yml
      - --rule=/etc/alerts/host/*.yml
      - --rule=/etc/alerts/monitoring/*.yml
      - --evaluationInterval=30s
      - --external.label=env=${ENV_NAME:-prod}
      - --loggerLevel=WARN
    ports:
      - "127.0.0.1:8880:8880"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8880/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        limits:
          memory: ${VMALERT_MEM_LIMIT:-256M}
          cpus: "0.2"

  alertmanager:
    <<: *common
    image: prom/alertmanager:v0.34.0
    volumes:
      - ./alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - am-data:/alertmanager
    ports:
      - "127.0.0.1:9093:9093"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:9093/-/healthy"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        limits:
          memory: ${AM_MEM_LIMIT:-192M}
          cpus: "0.1"

  grafana:
    <<: *common
    image: grafana/grafana-oss:13.0.2
    depends_on:
      victoriametrics:
        condition: service_healthy
      victorialogs:
        condition: service_started
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana-provisioning:/etc/grafana/provisioning:ro
      - ./grafana.ini:/etc/grafana/grafana.ini:ro
      - ${GRAFANA_LOG_DIR:-/var/log/grafana}:/var/log/grafana
    environment:
      GF_INSTALL_PLUGINS: victoriametrics-logs-datasource
      GF_SECURITY_ADMIN_PASSWORD: ${GF_SECURITY_ADMIN_PASSWORD}
    ports:
      - "3000:3000"
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--no-verbose",
          "--tries=1",
          "--spider",
          "http://127.0.0.1:3000/api/health",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: ${GRAFANA_MEM_LIMIT:-768M}
          cpus: "0.4"

volumes:
  vm-data:
  vl-data:
  am-data:
  grafana-data:
