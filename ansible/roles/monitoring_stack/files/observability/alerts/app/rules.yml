groups:
  - name: app
    rules:
      - alert: Nginx5xxRateHigh
        expr: >-
          sum by (app) (rate(log_metric_counter_nginx_requests{status=~"5.."}[5m]))
            / sum by (app) (rate(log_metric_counter_nginx_requests[5m])) > 0.05
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "{{ $labels.app }} 5xx rate above 5%"
          description: "{{ $value | humanizePercentage }} of requests to {{ $labels.app }} are 5xx."

      - alert: Nginx400RateHigh
        expr: >-
          sum by (app) (rate(log_metric_counter_nginx_requests{status="400"}[5m]))
            / sum by (app) (rate(log_metric_counter_nginx_requests[5m])) > 0.10
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.app }} 400 rate above 10%"
          description: "{{ $value | humanizePercentage }} of requests to {{ $labels.app }} are 400."

      - alert: Nginx404RateHigh
        expr: >-
          sum by (app) (rate(log_metric_counter_nginx_requests{status="404"}[5m]))
            / sum by (app) (rate(log_metric_counter_nginx_requests[5m])) > 0.10
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.app }} 404 rate above 10%"
          description: "{{ $value | humanizePercentage }} of requests to {{ $labels.app }} are 404."

      - alert: NginxLatencyHigh
        expr: >-
          histogram_quantile(0.95, sum by (app, le) (rate(log_metric_histogram_nginx_request_duration_seconds_bucket[5m]))) > 2
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.app }} p95 latency above 2s"
          description: "p95 request latency for {{ $labels.app }} has been above 2s for 5m+."

      - alert: AppMemoryNearLimit
        expr: app_mem_pct > 90
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.instance_name }} {{ $labels.app }} at {{ $value | printf \"%.0f\" }}% of its memory limit"
          description: "Above 90% of MemoryMax for 5m+. At 100% the kernel OOM-kills it and systemd restarts it."

      - alert: NginxStatusUnreachable
        expr: nginx_up == 0
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.instance_name }} nginx-prometheus-exporter can't read stub_status"
          description: "nginx_up has been 0 for 2m -- nginx is down or the status server stopped answering."

      - alert: NginxExporterMissing
        expr: lag(nginx_up{job="oci-app"}[1h]) > 180
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.instance_name }} sent no nginx metrics for {{ $value | humanizeDuration }}"
          description: "nginx_exporter or Fluent Bit stopped on the host, so NginxStatusUnreachable can't fire either."
