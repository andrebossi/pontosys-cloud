groups:
  - name: host
    rules:
      - alert: HostMemoryHigh
        expr: >-
          100 * (1 - node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes) > 90
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "{{ $labels.instance_name }} memory above 90%"
          description: "{{ $value | printf \"%.1f\" }}% memory used for 5m+."

      - alert: HostDiskSpaceLow
        expr: >-
          100 * (1 - node_filesystem_avail_bytes{fstype!~"tmpfs|overlay"}
                     / node_filesystem_size_bytes{fstype!~"tmpfs|overlay"}) > 85
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.instance_name }} disk {{ $labels.mountpoint }} above 85%"
          description: "{{ $value | printf \"%.1f\" }}% used for 10m+."

      - alert: HostDiskSpaceCritical
        expr: >-
          100 * (1 - node_filesystem_avail_bytes{fstype!~"tmpfs|overlay|vfat"}
                     / node_filesystem_size_bytes{fstype!~"tmpfs|overlay|vfat"}) > 95
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "{{ $labels.instance_name }} disk {{ $labels.mountpoint }} above 95%"
          description: "{{ $value | printf \"%.1f\" }}% used. Writes (logs, uploads, packages) start failing when it fills."

      - alert: HostDiskWillFillIn24h
        expr: >-
          predict_linear(node_filesystem_avail_bytes{fstype!~"tmpfs|overlay|vfat"}[6h], 24 * 3600) < 0
            and node_filesystem_avail_bytes{fstype!~"tmpfs|overlay|vfat"}
                / node_filesystem_size_bytes{fstype!~"tmpfs|overlay|vfat"} < 0.25
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.instance_name }} disk {{ $labels.mountpoint }} fills within 24h"
          description: "At the growth rate of the last 6h, {{ $labels.mountpoint }} runs out of space within a day."

      - alert: HostInodesLow
        expr: >-
          node_filesystem_files_free{fstype!~"tmpfs|overlay|vfat"}
            / node_filesystem_files{fstype!~"tmpfs|overlay|vfat"} < 0.10
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.instance_name }} inodes on {{ $labels.mountpoint }} below 10%"
          description: "{{ $value | humanizePercentage }} of inodes free. No new files can be created at 0, whatever the free space."

      - alert: HostCpuHigh
        expr: >-
          100 * (1 - avg by (instance, instance_name, job) (rate(node_cpu_seconds_total{mode="idle"}[5m]))) > 90
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.instance_name }} CPU above 90%"
          description: "{{ $value | printf \"%.0f\" }}% busy for 15m+. On an app host every API slows down together."

      - alert: HostSystemdUnitFailed
        expr: node_systemd_unit_state{state="failed"} == 1
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "{{ $labels.instance_name }} unit {{ $labels.name }} failed"
          description: "systemd reports {{ $labels.name }} in the failed state for 2m+."

      - alert: HostOOMKill
        expr: increase(node_vmstat_oom_kill[5m]) > 0
        labels:
          severity: critical
        annotations:
          summary: "{{ $labels.instance_name }} OOM killer ran"
          description: "The kernel OOM killer fired in the last 5m. Which process: VictoriaLogs job:=host \"Killed process\"."

      - alert: HostDown
        expr: lag(node_boot_time_seconds[1h]) > 180
        labels:
          severity: critical
        annotations:
          summary: "{{ $labels.instance_name }} stopped reporting"
          description: "No metrics for {{ $value | humanizeDuration }}: the host is down, unreachable, or Fluent Bit stopped. A pool scale-in looks the same for up to 1h."

      - alert: ServiceDown
        expr: node_systemd_unit_state{name=~"dotnet-app@.+|nginx.service", state="active"} == 0
        for: 3m
        labels:
          severity: critical
        annotations:
          summary: "{{ $labels.instance_name }} {{ $labels.name }} is not running"
          description: "Not active for 3m+: crashed, failed to start, or not deployed on this host."

      - alert: ServiceRestartedAfterFailure
        expr: increase(node_systemd_service_restart_total{name=~"dotnet-app@.+|nginx.service"}[10m]) > 0
        labels:
          severity: critical
        annotations:
          summary: "{{ $labels.instance_name }} {{ $labels.name }} crashed and was restarted"
          description: "systemd restarted it {{ $value | printf \"%.0f\" }}x in 10m (crash or OOM kill). Logs: job:=app unit:=\"{{ $labels.name }}\"."
