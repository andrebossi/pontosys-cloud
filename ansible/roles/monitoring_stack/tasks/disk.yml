---
- name: Check for the OCI udev symlink
  ansible.builtin.stat:
    path: /dev/oracleoci/oraclevdb
  register: oraclevdb_symlink

- name: Set the data disk device
  ansible.builtin.set_fact:
    monitoring_data_disk: "{{ '/dev/oracleoci/oraclevdb' if oraclevdb_symlink.stat.exists else '/dev/sdb' }}"

- name: Partition the second disk
  community.general.parted:
    device: "{{ monitoring_data_disk }}"
    number: 1
    state: present
    fs_type: ext4

- name: Filesystem
  community.general.filesystem:
    fstype: ext4
    dev: "{{ monitoring_data_disk }}1"

- name: Mounted and in fstab
  ansible.posix.mount:
    path: /mnt/monitoring-data
    src: "{{ monitoring_data_disk }}1"
    fstype: ext4
    state: mounted

- name: Metrics and logs, side by side on it
  ansible.builtin.file:
    path: "/mnt/monitoring-data/{{ item }}"
    state: directory
  loop: [metrics, logs]
