---
- name: Partition the second disk
  community.general.parted:
    device: /dev/oracleoci/oraclevdb
    number: 1
    state: present
    fs_type: ext4

- name: Filesystem
  community.general.filesystem:
    fstype: ext4
    dev: /dev/oracleoci/oraclevdb1

- name: Mounted and in fstab
  ansible.posix.mount:
    path: /mnt/monitoring-data
    src: /dev/oracleoci/oraclevdb1
    fstype: ext4
    state: mounted

- name: Metrics and logs, side by side on it
  ansible.builtin.file:
    path: "/mnt/monitoring-data/{{ item }}"
    state: directory
  loop: [metrics, logs]
