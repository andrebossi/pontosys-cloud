---
- name: Docker repository
  ansible.builtin.deb822_repository:
    name: docker
    types: [deb]
    uris: "https://download.docker.com/linux/ubuntu"
    suites: "{{ ansible_facts['distribution_release'] }}"
    components: [stable]
    architectures: ["{{ {'x86_64': 'amd64', 'aarch64': 'arm64'}[ansible_facts['architecture']] }}"]
    signed_by: https://download.docker.com/linux/ubuntu/gpg
    state: present

- name: Engine and the compose plugin
  ansible.builtin.apt:
    name:
      - docker-ce
      - docker-ce-cli
      - containerd.io
      - docker-compose-plugin
    state: present
    update_cache: true

- name: Daemon configuration
  ansible.builtin.copy:
    dest: /etc/docker/daemon.json
    mode: "0644"
    content: |
      {
        "log-driver": "json-file",
        "log-opts": { "max-size": "10m", "max-file": "3" },
        "live-restore": true
      }
  notify: restart docker

- name: Docker is running
  ansible.builtin.systemd:
    name: docker
    state: started
    enabled: true

- name: Python bindings community.docker needs
  ansible.builtin.apt:
    name: python3-requests
    state: present
