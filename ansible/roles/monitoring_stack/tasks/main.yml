---
- name: The container limits fit the machine
  ansible.builtin.assert:
    that: container_mb <= monitoring_mem_budget_mb
    fail_msg: >-
      The container limits add up to {{ container_mb }} MB, over the
      {{ monitoring_mem_budget_mb }} MB allocated to the monitoring stack on a
      {{ (ansible_facts['memtotal_mb'] / 1024) | round(1) }} GB machine that also runs
      other things. Lower a limit or raise monitoring_mem_budget_mb.
    success_msg: "{{ container_mb }} MB of {{ monitoring_mem_budget_mb }} MB allocated"
    quiet: true
  vars:
    container_mb: >-
      {{ [vm_mem_limit, vl_mem_limit, vmalert_mem_limit,
          alertmanager_mem_limit, grafana_mem_limit]
         | map('human_to_bytes') | sum // 1048576 }}

- name: Docker
  ansible.builtin.include_tasks: docker.yml

- name: Stack directories
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    owner: "{{ item.owner | default('root') }}"
    mode: "{{ item.mode | default('0750') }}"
  loop:
    - path: "{{ observability_dir }}"
      mode: "0755"
    - path: "{{ grafana_log_dir }}"
      owner: "472"
      mode: "0755"

- name: Compose, alerts and provisioning
  ansible.builtin.copy:
    src: observability/
    dest: "{{ observability_dir }}/"
    mode: "0644"
    directory_mode: "0755"
  notify: restart observability

# Both files below need these facts, so they are resolved first.
- name: Grafana administrator password
  ansible.builtin.include_tasks: secret.yml
  vars:
    monitoring_secret_name: grafana-admin
    monitoring_secret_var: grafana_admin_password

- name: Grafana secret key
  ansible.builtin.include_tasks: secret.yml
  vars:
    monitoring_secret_name: grafana-secret-key
    monitoring_secret_var: grafana_secret_key

- name: grafana.ini
  ansible.builtin.template:
    src: grafana.ini.j2
    dest: "{{ observability_dir }}/grafana.ini"
    mode: "0644"
  notify: restart observability

# All sizing (retention, disk ceiling, memory and CPU limits) lives here. The
# docker-compose.yml stays generic and runs the same on any host.
- name: Backend budget
  ansible.builtin.template:
    src: env.j2
    dest: "{{ observability_dir }}/.env"
    mode: "0655"
  no_log: true
  notify: restart observability

- name: Grafana fail2ban filter
  ansible.builtin.copy:
    src: grafana-local.conf
    dest: /etc/fail2ban/filter.d/grafana-local.conf
    mode: "0644"
  notify: restart fail2ban

- name: Valid compose file
  ansible.builtin.command:
    cmd: docker compose config --quiet
    chdir: "{{ observability_dir }}"
  changed_when: false

- name: Bring the stack up
  community.docker.docker_compose_v2:
    project_src: "{{ observability_dir }}"
    state: present
    wait: true

- name: Backends responding
  ansible.builtin.uri:
    url: "{{ item }}"
    status_code: 200
  loop:
    - http://127.0.0.1:8428/health
    - http://127.0.0.1:9428/health
    - http://127.0.0.1:3000/api/health
  register: backend_health
  retries: 18
  delay: 10
  until: backend_health is succeeded
  changed_when: false

