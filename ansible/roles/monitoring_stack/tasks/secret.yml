---
# Generate on first use, store immediately, read back ever after. Same shape as
# roles/db_users: the vault is where the value lives, and nothing else on the
# machine or in this repository ever holds it.
#
#   in   monitoring_secret_name   short name; the <secret_prefix>- half is added
#   out  the fact named by monitoring_secret_var

- name: "{{ monitoring_secret_name }} — read"
  oracle.oci.oci_secrets_secret_bundle_facts:
    secret_name: "{{ secret_prefix }}-{{ monitoring_secret_name }}"
    vault_id: "{{ oci_vault_id }}"
    stage: CURRENT
    auth_type: "{{ oci_auth_type }}"
  delegate_to: localhost
  become: false
  register: found
  # Not being there yet is the next task, not a failure.
  # ignore_errors, NOT failed_when: false. failed_when OVERWRITES the flag --
  # the result comes back failed=False even when the call failed, so the
  # "which ones are missing" check below would always find none and nothing
  # would ever be created.
  ignore_errors: true
  changed_when: false
  no_log: true

- name: "{{ monitoring_secret_name }} — generate and store"
  when: found.failed | default(false)
  block:
    - name: "{{ monitoring_secret_name }} — generate"
      ansible.builtin.set_fact:
        new_secret: "{{ lookup('password', '/dev/null length=32 chars=ascii_letters,digits') }}"
      no_log: true

    # state: present on a name that already exists adds a VERSION rather than
    # replacing it, so this can never destroy a password someone is using.
    - name: "{{ monitoring_secret_name }} — store"
      oracle.oci.oci_vault_secret:
        compartment_id: "{{ compartment_ocid }}"
        vault_id: "{{ oci_vault_id }}"
        key_id: "{{ oci_vault_key_id }}"
        secret_name: "{{ secret_prefix }}-{{ monitoring_secret_name }}"
        description: "{{ monitoring_secret_name }}, generated by ansible"
        secret_content:
          content_type: BASE64
          content: "{{ new_secret | b64encode }}"
        state: present
        auth_type: "{{ oci_auth_type }}"
      delegate_to: localhost
      become: false
      no_log: true

- name: "{{ monitoring_secret_name }} — in hand"
  ansible.builtin.set_fact:
    "{{ monitoring_secret_var }}": >-
      {{ new_secret if found.failed | default(false)
         else (found.secret_bundle.secret_bundle_content.content | b64decode) }}
  no_log: true
