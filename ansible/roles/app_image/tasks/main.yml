---
- name: Python venv e pip
  ansible.builtin.apt:
    name: [python3-venv, python3-pip]
    state: present
    update_cache: true

- name: Diretório dos drivers
  ansible.builtin.file:
    path: "{{ image_venv | dirname }}"
    state: directory
    mode: "0755"

- name: requirements.txt
  ansible.builtin.copy:
    src: requirements.txt
    dest: "{{ image_venv | dirname }}/requirements.txt"
    mode: "0644"

- name: SDK da OCI no venv
  ansible.builtin.pip:
    requirements: "{{ image_venv | dirname }}/requirements.txt"
    virtualenv: "{{ image_venv }}"
    virtualenv_command: python3 -m venv
    state: present

- name: Driver de imagem
  ansible.builtin.copy:
    src: image.py
    dest: "{{ image_venv | dirname }}/image.py"
    mode: "0755"

- name: Atalho em /usr/local/bin
  ansible.builtin.copy:
    dest: /usr/local/bin/image
    mode: "0755"
    content: |
      #!/bin/sh
      exec {{ image_venv }}/bin/python {{ image_venv | dirname }}/image.py \
        --compartment-id={{ compartment_ocid }} --family={{ image_family }} "$@"

- name: "image {{ image_action }}"
  ansible.builtin.command:
    argv: >-
      {{ ['/usr/local/bin/image', image_action]
         + (['--pool', image_pool] if image_action == 'release' else [])
         + ((['--latest'] if image_latest | bool else ['--image-id', image_id])
            if image_action == 'release' else [])
         + (['--keep', image_keep | string,
             '--min-age-seconds', image_min_age_seconds | string]
            if image_action == 'prune' else []) }}
  register: image_run
  changed_when: image_action in ['release', 'prune']

- name: Resultado
  ansible.builtin.debug:
    msg: "{{ image_run.stdout_lines }}"
