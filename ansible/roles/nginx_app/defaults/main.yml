---
nginx_listen_port: 80
nginx_user: nginx
nginx_worker_processes: auto
nginx_worker_connections: 4096
nginx_worker_rlimit_nofile: 65535
nginx_static_root: /usr/share/nginx/html
nginx_access_log: /var/log/nginx/access.json.log
nginx_error_log: /var/log/nginx/error.log
nginx_error_log_level: warn
nginx_status_port: 8081
nginx_large_client_header_buffers: "4 32k"
nginx_open_file_cache: "max=2000 inactive=60s"
nginx_gzip: {enabled: false}
nginx_error_pages: {}
applications: {}
static_sites: {}
app_nginx_tiers: {}
app_upstream_max_fails: 3
app_upstream_fail_timeout: 10s
app_upstream_keepalive: 16

# Whether to publish the static content from files/nginx/nginx-config. Turned
# off in the golden image: the SPA bundles are ~140 MB and belong in an
# artifact, not baked into every machine image.
nginx_deploy_static: true
