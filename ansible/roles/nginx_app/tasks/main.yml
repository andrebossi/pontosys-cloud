---
- name: Install NGINX
  ansible.builtin.include_role:
    name: nginxinc.nginx_core.nginx
  vars:
    nginx_service_modify: true
    nginx_service_timeout: 30

- name: Log directory
  ansible.builtin.file:
    path: /var/log/nginx
    state: directory
    owner: "{{ nginx_user }}"
    group: adm
    mode: "0755"

- name: Main configuration
  ansible.builtin.template:
    src: nginx.conf.j2
    dest: /etc/nginx/nginx.conf
    mode: "0644"
    backup: true
    validate: nginx -t -c %s
  notify: reload nginx

- name: Application server block
  ansible.builtin.template:
    src: apps.conf.j2
    dest: /etc/nginx/conf.d/apps.conf
    mode: "0644"
    backup: true
  notify: reload nginx

- name: Status endpoint
  ansible.builtin.template:
    src: status.conf.j2
    dest: /etc/nginx/conf.d/status.conf
    mode: "0644"
  notify: reload nginx

- name: Remove the packaged default server
  ansible.builtin.file:
    path: /etc/nginx/conf.d/default.conf
    state: absent
  notify: reload nginx

- name: Document root
  ansible.builtin.file:
    path: "{{ nginx_static_root }}"
    state: directory
    owner: "{{ nginx_user }}"
    group: "{{ nginx_user }}"
    mode: "0755"

- name: Error pages
  ansible.builtin.include_tasks: error_pages.yml

- name: NGINX is running
  ansible.builtin.systemd:
    name: nginx
    state: started
    enabled: true

- name: Flush pending reloads before checking
  ansible.builtin.meta: flush_handlers

- name: The running process has the configuration on disk
  ansible.builtin.systemd:
    name: nginx
    state: reloaded
  changed_when: false

- name: The load balancer health check answers
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ nginx_listen_port }}/healthz"
    return_content: true
  register: healthz
  changed_when: false
  failed_when: "'ok' not in healthz.content"
