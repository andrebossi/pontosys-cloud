---
# Error pages ship with the role: eleven kilobytes, named by error_page in
# nginx.conf, and nginx has to serve one before any artifact exists.
- name: Error pages
  ansible.builtin.copy:
    src: "{{ item }}"
    dest: "{{ nginx_static_root }}/{{ item }}"
    owner: "{{ nginx_user }}"
    group: "{{ nginx_user }}"
    mode: "0644"
  loop: [404.html, 50x.html, nginx-logo.png]

- name: poweredby.png
  ansible.builtin.file:
    path: "{{ nginx_static_root }}/poweredby.png"
    src: "{{ nginx_static_root }}/nginx-logo.png"
    state: link
    force: true

# The three frontends in one tarball, unpacked over the document root. The
# stamp is what makes it idempotent: the tarball has no single file whose
# presence proves the version, so the version is recorded explicitly.
- name: Artifact cache on the controller
  ansible.builtin.file:
    path: "{{ artifact_cache }}"
    state: directory
    mode: "0700"
  delegate_to: localhost
  become: false
  run_once: true
  changed_when: false

- name: Namespace
  oracle.oci.oci_object_storage_namespace_facts:
    auth_type: "{{ oci_auth_type }}"
  delegate_to: localhost
  become: false
  changed_when: false
  register: ns
  when: oci_namespace is not defined

- name: Remember it
  ansible.builtin.set_fact:
    oci_namespace: "{{ ns.namespace }}"
  when: oci_namespace is not defined

# The three frontends in one tarball, unpacked over the document root. The
# stamp is what makes it idempotent: no single file in the tarball proves the
# version, so the version is recorded explicitly.
- name: Web root {{ webroot_version }}
  oracle.oci.oci_object_storage_object:
    namespace_name: "{{ oci_namespace }}"
    bucket_name: "{{ artifact_bucket }}"
    object_name: "artifacts/webroot/webroot-{{ webroot_version }}.tar.gz"
    dest: "{{ artifact_cache }}/webroot-{{ webroot_version }}.tar.gz"
    state: present
  delegate_to: localhost
  become: false
  changed_when: false

- name: Unpack it
  ansible.builtin.unarchive:
    src: "{{ artifact_cache }}/webroot-{{ webroot_version }}.tar.gz"
    dest: "{{ nginx_static_root }}"
    owner: "{{ nginx_user }}"
    group: "{{ nginx_user }}"
    creates: "{{ nginx_static_root }}/.webroot-{{ webroot_version }}"
  register: webroot

- name: Stamp it
  ansible.builtin.file:
    path: "{{ nginx_static_root }}/.webroot-{{ webroot_version }}"
    state: touch
    mode: "0644"
    modification_time: preserve
    access_time: preserve
  changed_when: false

- name: Readable by nginx
  ansible.builtin.file:
    path: "{{ nginx_static_root }}"
    owner: "{{ nginx_user }}"
    group: "{{ nginx_user }}"
    recurse: true
  when: webroot is changed
