---
# The SPA bundles and the error pages, as one artifact in the store. They are
# build output, not configuration: they belong next to the application
# tarballs, not in this repository. Publish with
#   tar -C webroot -czf webroot.tar.gz . && pscloud push webroot <ver> ./webroot.tar.gz
- name: Web root version
  ansible.builtin.include_role:
    name: artifact
    tasks_from: latest.yml
  vars:
    artifact_names: ["{{ webroot_artifact }}"]
  when: webroot_version == 'latest'

- name: Web root
  ansible.builtin.include_role:
    name: artifact
    tasks_from: fetch.yml
  vars:
    artifact_name: "{{ webroot_artifact }}"
    artifact_version: "{{ webroot_version if webroot_version != 'latest'
                          else artifact_versions[webroot_artifact] }}"
    artifact_dest: "{{ nginx_static_root }}"
    artifact_owner: "{{ nginx_user }}"
    artifact_group: "{{ nginx_user }}"

# 404.html and 50x.html reference /poweredby.png, which was a symlink to
# nginx-logo.png on the old machine; without it both pages render a broken
# image.
- name: poweredby.png
  ansible.builtin.file:
    path: "{{ nginx_static_root }}/poweredby.png"
    src: "{{ nginx_static_root }}/nginx-logo.png"
    state: link
    force: true
