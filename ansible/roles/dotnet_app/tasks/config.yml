---
- name: Application settings
  ansible.builtin.template:
    src: appsettings.json.j2
    dest: "{{ app_deploy_root }}/{{ item.key }}/shared/appsettings.Production.json"
    owner: root
    group: "{{ app_deploy_user }}"
    mode: "0640"
    validate: "python3 -c \"import json,sys; json.load(open(sys.argv[1]))\" %s"
  loop: "{{ applications | dict2items }}"
  loop_control:
    label: "{{ item.key }}"
  register: settings

- name: Vault is configured
  ansible.builtin.assert:
    that: oci_vault_id | default('') | length > 0
    fail_msg: >-
      oci_vault_id is empty, so the {{ app_secret_names | length }} secrets this
      host needs cannot be read. It comes from OCI_VAULT_OCID; see
      keys/.env.example, then `source keys/.env`.
    quiet: true

- name: Secrets
  oracle.oci.oci_secrets_secret_bundle_facts:
    secret_name: "{{ secret_prefix }}-{{ item }}"
    vault_id: "{{ oci_vault_id }}"
    stage: CURRENT
    auth_type: "{{ oci_auth_type }}"
  delegate_to: localhost
  become: false
  loop: "{{ app_secret_names }}"
  register: bundles
  changed_when: false
  retries: 5
  delay: 15
  until: bundles is succeeded
  no_log: true

- name: Values
  ansible.builtin.set_fact:
    secret_values: >-
      {{ dict(app_secret_names | zip(bundles.results
              | map(attribute='secret_bundle.secret_bundle_content.content')
              | map('b64decode'))) }}
  no_log: true

- name: Secret versions in use
  ansible.builtin.debug:
    msg: >-
      {{ dict(app_secret_names | zip(bundles.results
              | map(attribute='secret_bundle.version_number'))) }}

- name: Environment files
  ansible.builtin.template:
    src: app.env.j2
    dest: "{{ app_config_dir }}/{{ item.key }}.env"
    owner: root
    group: "{{ app_deploy_user }}"
    mode: "0640"
  loop: "{{ applications | dict2items }}"
  loop_control:
    label: "{{ item.key }}"
  register: envfiles
  no_log: true

- name: Applications are enabled
  ansible.builtin.systemd:
    name: "dotnet-app@{{ item.key }}.service"
    enabled: true
    daemon_reload: true
  loop: "{{ applications | dict2items }}"
  loop_control:
    label: "{{ item.key }}"

- name: Restart what changed
  block:
    - name: Which applications are deployed
      ansible.builtin.stat:
        path: "{{ app_deploy_root }}/{{ item.key }}/current"
      loop: "{{ applications | dict2items }}"
      loop_control:
        label: "{{ item.key }}"
      register: current

    - name: Deployed, and changed
      ansible.builtin.set_fact:
        deployed: "{{ current.results | selectattr('stat.exists') | map(attribute='item.key') | list }}"
        changed_apps: >-
          {{ (settings.results + envfiles.results + runtime_dropin.results + limits_dropin.results)
             | selectattr('changed') | map(attribute='item.key') | unique | list }}

    - name: Running
      ansible.builtin.systemd:
        name: "dotnet-app@{{ item }}.service"
        state: started
      loop: "{{ deployed }}"

    - name: Restarted
      ansible.builtin.systemd:
        name: "dotnet-app@{{ item }}.service"
        state: restarted
      loop: "{{ changed_apps | intersect(deployed) }}"
