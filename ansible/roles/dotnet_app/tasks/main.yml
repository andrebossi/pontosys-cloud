---
# units.yml is what the golden image bakes: users, directories, the slice and
# the unit files. config.yml reads secrets and only runs against a live
# machine -- an image is shared by the whole fleet and must not carry any.
- name: Units, slice and directories
  ansible.builtin.include_tasks: units.yml

- name: Configuration and secrets
  ansible.builtin.include_tasks: config.yml
