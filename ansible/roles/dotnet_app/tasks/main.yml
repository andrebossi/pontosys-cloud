---
# units.yml is what the golden image bakes: the account, the directories, the
# slice and the unit files. config.yml reads credentials and only runs against
# a live machine -- an image is shared by the whole fleet and carries none.
- name: Units, slice and directories
  ansible.builtin.include_tasks: units.yml

- name: Configuration and secrets
  ansible.builtin.include_tasks: config.yml
