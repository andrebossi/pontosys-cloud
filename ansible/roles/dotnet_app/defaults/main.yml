---
app_deploy_root: /srv/apps
app_deploy_user: dotnetapp
app_config_dir: /etc/dotnet-apps
app_dumps_dir: /var/lib/dotnet-dumps

applications: {}
app_tiers: {}
dotnet_runtime_env: {}
app_settings_common: {}
app_settings: {}
app_secrets_common: {}
app_secrets: {}
db_servers: {}
db_connection_options: ""

# ASP.NET Core does not call sd_notify unless the app was built with
# .UseSystemd(). Type=notify on an app that does not would make systemd wait
# out TimeoutStartSec and then declare a working app failed. `exec` is the
# honest default: it catches an exec failure but does not pretend to know when
# the app is ready -- that is what the deploy health check is for.
app_systemd_type: exec

# Set at the runtime layer; repeated here so the role can be used on its own.
dotnet_root: /opt/dotnet
dotnet_compat_dir: /opt/dotnet/compat
dotnet_default_runtime: "5.0"
dotnet_host_icu_version: "74"
