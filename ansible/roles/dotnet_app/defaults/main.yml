---
app_deploy_root: /srv/apps
app_deploy_user: dotnetapp
app_config_dir: /etc/dotnet-apps
app_dumps_dir: /var/lib/dotnet-dumps

applications: {}
app_tiers: {}
dotnet_runtime_env: {}
app_settings_common: {}
app_settings: {}

oci_auth_type: instance_principal

app_secret_names: >-
  {{ (applications.values() | selectattr('database', 'defined')
      | map(attribute='database.secret') | list)
     + (applications.values() | selectattr('secrets', 'defined')
        | map(attribute='secrets') | map('dict2items') | flatten
        | map(attribute='value') | list) | unique }}

dotnet_root: /opt/dotnet
dotnet_compat_dir: /opt/dotnet/compat
dotnet_host_icu_version: "74"

app_systemd_type: exec

db_connection_options: >-
  persistsecurityinfo=True;SslMode=none;AllowPublicKeyRetrieval=True;
  Convert Zero Datetime=true;Maximum Pool Size={{ db_pool_max }};

apps_slice_memory_max: "{{ host_memory_mb - apps_slice_reserve_mb }}M"
apps_slice_memory_high: "{{ ((host_memory_mb - apps_slice_reserve_mb) * 0.9) | int }}M"
apps_slice_memory_swap_max: 1G
apps_slice_cpu_quota: "{{ (host_vcpus * 100 * 0.85) | int }}%"
