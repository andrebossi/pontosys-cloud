---
- name: Exporter credential
  oracle.oci.oci_secrets_secret_bundle_facts:
    secret_name: "{{ secret_prefix }}-mysql-exporter"
    vault_id: "{{ oci_vault_id }}"
    stage: CURRENT
    auth_type: "{{ oci_auth_type }}"
  delegate_to: localhost
  become: false
  register: exporter_bundle
  changed_when: false
  no_log: true

- name: Connection
  ansible.builtin.set_fact:
    mysqld_exporter_dsn: >-
      {{ exporter_bundle.secret_bundle.secret_bundle_content.content
         | b64decode | from_json }}
  no_log: true

- name: Previous hand-rolled install
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - /opt/mysqld_exporter
    - /etc/mysqld_exporter/.my.cnf

- name: Exporter
  ansible.builtin.include_role:
    name: prometheus.prometheus.mysqld_exporter
