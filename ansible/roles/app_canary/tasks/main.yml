---
# Ubuntu 24.04 is PEP 668: pip on the system Python is refused. A dedicated
# venv solves this without --break-system-packages.
- name: Python venv and pip
  ansible.builtin.apt:
    name: [python3-venv, python3-pip]
    state: present
    update_cache: true

- name: Driver directory
  ansible.builtin.file:
    path: "{{ canary_venv | dirname }}"
    state: directory
    mode: "0755"

- name: requirements.txt
  ansible.builtin.copy:
    src: requirements.txt
    dest: "{{ canary_venv | dirname }}/requirements.txt"
    mode: "0644"
  register: canary_reqs

- name: OCI SDK in the venv
  ansible.builtin.pip:
    requirements: "{{ canary_venv | dirname }}/requirements.txt"
    virtualenv: "{{ canary_venv }}"
    virtualenv_command: python3 -m venv
    state: present
  when: canary_reqs.changed or not ansible_check_mode

- name: Canary driver
  ansible.builtin.copy:
    src: canary.py
    dest: "{{ canary_venv | dirname }}/canary.py"
    mode: "0755"

- name: Shortcut in /usr/local/bin
  ansible.builtin.copy:
    dest: /usr/local/bin/canary
    mode: "0755"
    content: |
      #!/bin/sh
      exec {{ canary_venv }}/bin/python {{ canary_venv | dirname }}/canary.py \
        --compartment-id={{ compartment_ocid }} --port={{ canary_backend_port }} "$@"

- name: "canary {{ canary_action }}"
  ansible.builtin.command:
    argv: >-
      {{ ['/usr/local/bin/canary', canary_action]
         + ([canary_percent | string] if canary_action == 'shift' else [])
         + (['--size', canary_size | string] if canary_action == 'up' else [])
         + (['--metrics-url', canary_metrics_url,
             '--window', canary_gate_window,
             '--min-requests', canary_gate_min_requests | string,
             '--max-error-rate', canary_gate_max_error_rate | string,
             '--max-error-delta', canary_gate_max_error_delta | string,
             '--max-latency-ratio', canary_gate_max_latency_ratio | string]
            if canary_action == 'gate' else []) }}
  register: canary_run
  # The gate is a read. It fails the play when the canary looks worse, which
  # is the point -- a pipeline step that stops the ramp.
  changed_when: canary_action in ['up', 'shift', 'promote', 'abort']

- name: Result
  ansible.builtin.debug:
    msg: "{{ canary_run.stdout_lines }}"
